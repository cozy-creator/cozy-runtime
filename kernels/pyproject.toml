[project]
name = "cozy-kernels"
# Released with each Runtime minor; Runtime depends on `cozy-kernels==<minor>.*`.
version = "0.1.0"
description = "Cozy's prebuilt CUDA kernels: one wheel per OS and CPU, every GPU target inside"
# The GEMMs derive from comfy-kitchen, vLLM and SGLang (Apache-2.0; comfy-kitchen's NOTICE
# rides); CUTLASS and FlashAttention-3 are BSD-3-Clause.
license-files = ["LICENSE", "NOTICE", "LICENSE-cutlass", "LICENSE-flash-attention"]
requires-python = ">=3.12"

[build-system]
requires = ["scikit-build-core==1.0.3", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "1.0"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["src/cozy_kernels"]
# cp312-abi3: one file serves every Python from 3.12.
wheel.py-api = "cp312"

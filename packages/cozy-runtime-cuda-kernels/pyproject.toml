[build-system]
requires = ["scikit-build-core==1.0.3", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "cozy-runtime-cuda-kernels"
version = "0.1.0+torch2.13cu130"
description = "Cozy's purpose-built CUDA kernels for its Torch 2.13/CUDA 13 worker profile"
requires-python = ">=3.12"
dependencies = ["torch==2.13.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.scikit-build]
wheel.packages = ["src/cozy_runtime_cuda_kernels"]
wheel.py-api = "cp312"
cmake.build-type = "Release"

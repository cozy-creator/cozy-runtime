[build-system]
requires = ["scikit-build-core==1.0.3", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "cozy-runtime-cuda-kernels"
version = "0.1.0"
description = "Cozy's purpose-built CUDA kernels: nanobind + DLPack over the CUDA runtime, abi3"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.scikit-build]
wheel.packages = ["src/cozy_runtime_cuda_kernels"]
wheel.py-api = "cp312"
cmake.build-type = "Release"

[project]
name = "cozy-runtime"
version = "0.0.1"
description = "Cozy v2 worker runtime: author surface, supervisor, executor"
requires-python = ">=3.11"
dependencies = ["msgspec>=0.19"]

[dependency-groups]
# Pinned dev tooling: CI and scripts/redarm.py both need these on the venv, not behind
# an ad-hoc `--with` on every invocation.
dev = ["mypy>=1.13", "ruff>=0.16"]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "examples"]
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

[tool.ruff]
line-length = 100
src = ["src", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

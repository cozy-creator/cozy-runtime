[project]
name = "cozy-runtime"
version = "0.35.2"
description = "Cozy author surface and device executor"
# The native wheels carry the kernels (`kernels/`): derived from comfy-kitchen, vLLM and SGLang
# (Apache-2.0, comfy-kitchen's NOTICE), with CUTLASS and FlashAttention-3 (BSD-3-Clause). The
# pure wheel ships the same manifest.
license-files = [
    "kernels/LICENSE",
    "kernels/NOTICE",
    "kernels/LICENSE-cutlass",
    "kernels/LICENSE-flash-attention",
]
requires-python = ">=3.12"
dependencies = [
    "tensorfs>=0.17.6,<0.18",
    "cryptography>=45",
    "msgspec>=0.19",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=12",
]

[dependency-groups]
# Pinned dev tooling: CI needs these on the venv, not behind an ad-hoc `--with` on
# every invocation.
dev = [
    "mypy>=1.13",
    "ruff>=0.16",
]
# The Diffusers integrations (fused glue, attention producers, Ulysses CP, LoRA composition).
# Packages declare their own.
diffusers = [
    "peft>=0.20,<0.21",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "torch>=2.14",
    "torchvision>=0.28",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"
cozy-native-wheel-proof = "cozy_runtime.cli.native_wheel_proof:main"

[build-system]
# The pure wheel and the sdist. `task wheel` makes each native wheel from the pure one plus that
# platform's kernel modules (kernels.yaml).
requires = ["hatchling"]
build-backend = "hatchling.build"

# Local dotenv files are not distribution source. VCS ignores also exclude task/output trees.
[tool.hatch.build.targets.sdist]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true
# Lock against the immutable candidate before the matched release gate promotes it.
find-links = ["https://github.com/cozy-creator/cozy-creator/releases/expanded_assets/tensorfs-v0.17.6"]

[tool.mypy]
python_version = "3.12"
files = ["src", "checks", "examples"]
explicit_package_bases = true
mypy_path = "src:checks:examples/marco-polo:kernels/src"
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# torch is an OPTIONAL extra (§1.0: the base package is torch-free), so the checking venv
# does not have it and mypy cannot see its types. The consequence is recorded rather than
# papered over: the two modules that touch torch are checked without unused-ignore warnings
# and with torch itself untyped.
[[tool.mypy.overrides]]
module = ["torch.*", "peft.*", "triton.*", "numpy.*", "transformers.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# `av` is the `media` OPTIONAL extra, exactly like torch: the base package is media-free
# and the checking venv does not install it. The consequence is recorded rather than
# papered over — the two modules that touch PyAV are checked with PyAV untyped.
[[tool.mypy.overrides]]
module = ["av", "av.*"]
ignore_missing_imports = true

# TensorFS is a required typed dependency, including the public native record aliases.
# Missing bindings must fail type checking rather than silently becoming Any.

[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "diffusers",
    "diffusers.*",
    # `kernels` (cr-114): the image's loader for baked Hub kernels; in the executor's
    # environment, never the checking venv.
    "kernels",
    "safetensors",
    "safetensors.*",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cozy_runtime.internal.derive"]
warn_unused_ignores = false

[project.optional-dependencies]
assessment = ["cozy-eval>=0.7"]
# The derivation harness and the serving executor.
derive = ["torch>=2.14"]
media = [
    "av>=19.0.1",
]
# Executors read and place weights through TensorFS (`tensorfs`, `tensorfs.varena`). Local
# package environments select this capability; worker images provide the same range.
model-execution = ["tensorfs>=0.17.6,<0.18"]
# peft takes any transformers. Without these floors a resolver that picks huggingface-hub 2.x
# first backtracks to transformers 4.12, whose tokenizers has no wheel.
adapters = [
    "peft>=0.20,<0.21",
    "torch>=2.14",
    "transformers>=5.16.1",
    "tokenizers>=0.23.1",
]

[tool.ruff]
line-length = 100
src = ["src", "checks", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These aliases are reflected at runtime through typing.get_origin/get_args. PEP 695's
# TypeAliasType is deliberately not transparent and would change the package contract.
"src/cozy_runtime/author/_markers.py" = ["UP040"]

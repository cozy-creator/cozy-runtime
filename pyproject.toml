[project]
name = "cozy-runtime"
version = "0.18.102"
description = "Cozy v2 worker runtime: author surface, worker, executor"
# The upstream Apache-2.0 LICENSE/NOTICE ride every wheel: the cp312-abi3 wheel carries
# the derived native kernels, and shipping them from the pure wheel too keeps one manifest.
license-files = ["native/LICENSE", "native/NOTICE"]
requires-python = ">=3.12"
# The worker speaks `cozy.worker.v1` (worker-protocol/01), so the bindings' two runtimes are
# ordinary dependencies of the runtime package. The BINDINGS themselves are copied into
# `src/cozy/worker/v1/` VERBATIM — protoc's own output, byte-for-byte, under the proto
# package path its own import lines name — never depended on as a repo. Byte-identity is
# what `worker-protocol/scripts/vendored-diff.sh` checks (#536d), and it is why the copy no
# longer carries the old import rewrite.
dependencies = [
    "tensorfs>=0.3.90,<0.4",
    "cryptography>=45",
    "grpcio>=1.76",
    "msgspec>=0.19",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=12",
    "protobuf>=6.31",
]

[dependency-groups]
# Pinned dev tooling: CI needs these on the venv, not behind an ad-hoc `--with` on
# every invocation.
dev = [
    "mypy>=1.13",
    "pytest>=8.4",
    # The public capture reader validates the writer contract in tests.
    "cozy-eval==0.7.2",
    "ruff>=0.16",
    # Model-bound Runtime tests exercise the real compiled storage boundary.
    "tensorfs>=0.3.90,<0.4",
    "types-protobuf>=6.30",
    "av>=18.1,<19",
    # CI partitions this unchanged suite across independent delegated runners.
    "pytest-split>=0.11.0",
]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"
cozy-runtime-worker = "cozy_runtime.cli.runtime_worker:main"
cozy-native-wheel-proof = "cozy_runtime.cli.native_wheel_proof:main"

[tool.pytest.ini_options]
# ONE suite, FEW and REAL (decision 691, which repeals the earlier no-test ban). Most legs
# start a real process against a real build; the rest drive the real in-process construction
# and refusal paths. Nothing is mocked, stubbed or doubled anywhere, and a rule better held
# by a refusal belongs here rather than in `checks/architecture.py`.
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[build-system]
# ONE package, three wheel files per release. The in-tree shim delegates to
# hatchling — the toolchain-free default producing the py3-none-any wheel and the sdist —
# and, only when COZY_RUNTIME_BUILD_KERNELS=1, to scikit-build-core, which compiles
# `native/` into `cozy_runtime/_kernels/_C.abi3.so` and tags the wheel cp312-abi3.
# The release publisher adds the Go executable to that wheel and the ARM64 wheel.
requires = ["hatchling"]
build-backend = "dual_build_backend"
backend-path = ["scripts"]

# The public source archive includes the Go agent; default Python builds never compile it.
# Local dotenv files are not distribution source. VCS ignores also exclude task/output trees.
[tool.hatch.build.targets.sdist]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime", "src/cozy"]

[tool.uv]
package = true
# The historical SDXL development corpus and MiniMax H3 keep independently locked
# dependency cohorts; their published requirements describe minimum versions only.
conflicts = [[{ extra = "corpus" }, { extra = "minimax-h3" }]]

# Read only on the COZY_RUNTIME_BUILD_KERNELS=1 wheel build; the root CMakeLists.txt is
# the reviewed kernels build (static cudart, abi3, the upstream fleet arch policy).
[tool.scikit-build]
minimum-version = "1.0"
cmake.build-type = "Release"
wheel.packages = ["src/cozy_runtime", "src/cozy"]
wheel.py-api = "cp312"

[tool.mypy]
python_version = "3.12"
files = ["src", "checks", "tests", "examples"]
# The bindings live under the PROTO PACKAGE PATH (`src/cozy/worker/v1`) and are PEP 420
# namespace packages — no `__init__.py`, because protoc writes none and the copy is
# byte-identical. mypy needs the source roots stated for that, or it maps
# `src/cozy/worker/v1/wire_version.py` to bare `wire_version`.
explicit_package_bases = true
mypy_path = "src:checks:tests:examples/marco-polo:tests/testdata/static_describe/rich"
# The `extends` fixture imports its DEPENDENCY's modules, which is the whole point of it
# (cr-117). The rich fixture is that dependency, so mypy is pointed at it rather than
# told to ignore the import.
# The vendored protocol bindings are GENERATED bytes (protoc's output): checking them here
# would check protoc, and editing them to satisfy a checker would break the copy.
# `protocol/documents.py` beside them is hand-written and IS checked.
exclude = "src/cozy/worker/v1/worker_pb2|src/cozy_runtime/models/qwen_image21/upstream"
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# torch is an OPTIONAL extra (§1.0: the base package is torch-free), so the checking venv
# does not have it and mypy cannot see its types. The consequence is recorded rather than
# papered over: the two modules that touch torch are checked without unused-ignore warnings
# and with torch itself untyped. `checks/architecture.py::torch-free-import` is what actually
# holds the packaging rule; mypy never could.
[[tool.mypy.overrides]]
module = ["torch.*", "peft.*", "triton.*", "numpy.*", "transformers.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# `av` is the `media` OPTIONAL extra, exactly like torch: the base package is media-free
# and the checking venv does not install it. The consequence is recorded rather than
# papered over — the two modules that touch PyAV are checked with PyAV untyped.
[[tool.mypy.overrides]]
module = ["av", "av.*"]
ignore_missing_imports = true

# `tensorfs` is tfs-007's compiled facade. It SHIPS type information (`py.typed` plus a
# hand-written `_ext.pyi`), so this is not a case of an untyped dependency. The development
# environment installs it for model-bound Runtime tests; the base package still does not.
[[tool.mypy.overrides]]
module = ["tensorfs", "tensorfs.*"]
ignore_missing_imports = true

# `corpus/` is the adversarial corpus and the real-torch H3 fixture. Checking it here would
# be checking torch-shaped code against a torch that is not installed, which produces
# confident nonsense; it is exercised by running it in the corpus venv.
[[tool.mypy.overrides]]
# `huggingface_hub` is a CORPUS-venv dependency the fixture staging reaches for once, to
# fetch a tokenizer merges file the bench download skipped. Not a runtime dependency and
# not present in the checking venv.
# `PIL` joins them for cr-006: the fp8-vs-fp16 image comparison reads two PNGs the real
# package wrote and computes PSNR, in the corpus venv where Pillow already lives.
module = [
    "huggingface_hub",
    "diffusers",
    "diffusers.*",
    # `kernels` (cr-114): the image's loader for baked Hub kernels; in the executor's
    # environment, never the checking venv.
    "kernels",
    "safetensors",
    "safetensors.*",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["corpus.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cozy_runtime.internal.derive"]
warn_unused_ignores = false

[project.optional-dependencies]
qwen-image21 = [
    "diffusers>=0.40.0",
    "transformers>=5.17",
    "torch>=2.13",
    "torchvision>=0.28",
    "numpy>=1.26",
    "safetensors>=0.8",
    "tokenizers>=0.23.1",
]
# Builtins are imported only on explicit use. Worker images keep ownership of the
# compatible Torch/CUDA family; this extra does not pin a CUDA wheel or index.
minimax-h3 = [
    "peft>=0.20,<0.21",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "torch>=2.13",
    "torchvision>=0.28",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
]
assessment = ["cozy-eval>=0.7"]
# The derivation harness and the serving executor. Corpus venvs install this.
derive = ["torch>=2.13"]
# The separate SDXL corpus retains its own upstream dependency cohort.
corpus = ["torch>=2.13", "diffusers>=0.36", "transformers>=4.40"]
media = [
    "av>=18.1",
]
# Runtime owns the model byte plane. Local package environments select this complete
# capability; base worker images provide TensorFS from the same PyPI range.
# 0.3.82 hedges slow tail objects as fresh ranges (run 2322); 0.3.83 asks a wedged Hub again;
# 0.3.84 carries the weight plane (`tensorfs.plane`) that executors load weights through.
model-execution = ["tensorfs>=0.3.90,<0.4"]
# peft takes any transformers. Without these floors a resolver that picks huggingface-hub 2.x
# first backtracks to transformers 4.12, whose tokenizers has no wheel.
adapters = [
    "peft>=0.20,<0.21",
    "torch>=2.13",
    "transformers>=5.16.1",
    "tokenizers>=0.23.1",
]

[[tool.mypy.overrides]]
# grpcio ships no type information; the stub module is generated.
module = ["grpc", "grpc.*", "cozy.worker.v1.worker_pb2_grpc"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
src = ["src", "checks", "tests", "examples", "scripts"]
# Generated bindings: protoc's line lengths and import style are not ours to lint.
extend-exclude = ["src/cozy_runtime/models/qwen_image21/upstream", "src/cozy/worker/v1/worker_pb2.py",
                  "src/cozy/worker/v1/worker_pb2_grpc.py",
                  "src/cozy/worker/v1/worker_pb2.pyi",
                  "src/cozy/worker/v1/wire_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These aliases are reflected at runtime through typing.get_origin/get_args. PEP 695's
# TypeAliasType is deliberately not transparent and would change the package contract.
"src/cozy_runtime/author/_markers.py" = ["UP040"]

# Upstream architecture is attributed, import-relocated source, not handwritten typed SDK code.
[[tool.mypy.overrides]]
module = ["cozy_runtime.models.qwen_image21.upstream.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cozy_runtime.models.qwen_image21.model"]
disallow_subclassing_any = false

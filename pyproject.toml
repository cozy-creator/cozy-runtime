[project]
name = "cozy-runtime"
version = "0.0.1"
description = "Cozy v2 worker runtime: author surface, supervisor, executor"
requires-python = ">=3.11"
# The worker speaks `cozy.worker.v1` as the gRPC CLIENT (worker-protocol/01), so the
# bindings' two runtimes are ordinary dependencies of the runtime package. The BINDINGS
# themselves are copied into `cozy_runtime/protocol/`, never depended on as a repo.
dependencies = ["msgspec>=0.19", "protobuf>=6.31", "grpcio>=1.76"]

[dependency-groups]
# Pinned dev tooling: CI and scripts/redarm.py both need these on the venv, not behind
# an ad-hoc `--with` on every invocation.
dev = ["mypy>=1.13", "ruff>=0.16", "types-protobuf>=6.30"]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "examples"]
# The two derive-* runners live with the corpus they drive: they are torch-shaped code for
# the corpus venv, and checking them against a torch that is not installed produces
# confident nonsense. They are exercised by RUNNING them.
# The vendored th-024 bindings are GENERATED bytes (protoc's output): checking them here
# would check protoc, and editing them to satisfy a checker would break the copy.
# `protocol/documents.py` beside them is hand-written and IS checked.
exclude = "(scripts/derive-(corpus|verify)\\.py|src/cozy_runtime/protocol/worker_pb2)"
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# torch is an OPTIONAL extra (§1.0: the base package is torch-free), so the checking venv
# does not have it and mypy cannot see its types. The consequence is recorded rather than
# papered over: the two modules that touch torch are checked without unused-ignore warnings
# and with torch itself untyped. `scripts/fence.py::torch-free-import` is what actually
# holds the packaging rule; mypy never could.
[[tool.mypy.overrides]]
module = ["torch.*", "triton.*", "numpy.*"]
ignore_missing_imports = true

# `tensorfs` is tfs-007's compiled facade. It SHIPS type information (`py.typed` plus a
# hand-written `_ext.pyi`), so this is not a case of an untyped dependency: it is simply not
# installed in the checking venv, exactly like torch, because it is a native extension the
# base package does not require. The GPU venvs install the wheel; see README.
[[tool.mypy.overrides]]
module = ["tensorfs", "tensorfs.*"]
ignore_missing_imports = true

# `corpus/` is the adversarial corpus and the real-torch H3 fixture. Checking it here would
# be checking torch-shaped code against a torch that is not installed, which produces
# confident nonsense. It is exercised by RUNNING it (scripts/derive-corpus.py,
# scripts/derive-verify.py) in the corpus venv, which is the only place it can be true.
[[tool.mypy.overrides]]
# `huggingface_hub` is a CORPUS-venv dependency the fixture staging reaches for once, to
# fetch a tokenizer merges file the bench download skipped. Not a runtime dependency and
# not present in the checking venv.
module = ["huggingface_hub", "diffusers", "diffusers.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["corpus.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cozy_runtime.internal.derive"]
warn_unused_ignores = false

[project.optional-dependencies]
# The derivation harness and the serving executor. Corpus venvs install this.
derive = ["torch>=2.6"]
# `corpus/sdxl_real.py` is a real ENDPOINT: the model architecture is its dependency, not
# the runtime's (§1.1 — cozy-runtime defines none). Pinned here only so cr-005's real fill
# run reproduces; nothing under `src/` may import it.
corpus = ["torch>=2.6", "diffusers>=0.36", "transformers>=4.40,<5"]

[[tool.mypy.overrides]]
# grpcio ships no type information; the stub module is generated.
module = ["grpc", "grpc.*", "cozy_runtime.protocol.worker_pb2_grpc"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "examples"]
# Generated bindings: protoc's line lengths and import style are not ours to lint.
extend-exclude = ["src/cozy_runtime/protocol/worker_pb2.py",
                  "src/cozy_runtime/protocol/worker_pb2_grpc.py",
                  "src/cozy_runtime/protocol/worker_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

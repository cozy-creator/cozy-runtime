[project]
name = "cozy-runtime"
version = "0.0.1"
description = "Cozy v2 worker runtime: author surface, supervisor, executor"
requires-python = ">=3.11"
dependencies = ["msgspec>=0.19"]

[dependency-groups]
# Pinned dev tooling: CI and scripts/redarm.py both need these on the venv, not behind
# an ad-hoc `--with` on every invocation.
dev = ["mypy>=1.13", "ruff>=0.16"]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "examples"]
# The two derive-* runners live with the corpus they drive: they are torch-shaped code for
# the corpus venv, and checking them against a torch that is not installed produces
# confident nonsense. They are exercised by RUNNING them.
exclude = "scripts/derive-(corpus|verify)\\.py"
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# torch is an OPTIONAL extra (§1.0: the base package is torch-free), so the checking venv
# does not have it and mypy cannot see its types. The consequence is recorded rather than
# papered over: the two modules that touch torch are checked without unused-ignore warnings
# and with torch itself untyped. `scripts/fence.py::torch-free-import` is what actually
# holds the packaging rule; mypy never could.
[[tool.mypy.overrides]]
module = ["torch.*", "triton.*", "numpy.*"]
ignore_missing_imports = true

# `corpus/` is the adversarial corpus and the real-torch H3 fixture. Checking it here would
# be checking torch-shaped code against a torch that is not installed, which produces
# confident nonsense. It is exercised by RUNNING it (scripts/derive-corpus.py,
# scripts/derive-verify.py) in the corpus venv, which is the only place it can be true.
[[tool.mypy.overrides]]
module = ["corpus.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cozy_runtime.internal.derive"]
warn_unused_ignores = false

[project.optional-dependencies]
# The derivation harness and the serving executor. Corpus venvs install this.
derive = ["torch>=2.6"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[project]
name = "cozy-runtime"
version = "0.47.0.dev0"
description = "Cozy author surface and device executor"
# The native wheels carry the kernels (`kernels/`): derived from comfy-kitchen, vLLM and SGLang
# (Apache-2.0, comfy-kitchen's NOTICE), with CUTLASS and FlashAttention-3 (BSD-3-Clause). The
# pure wheel ships the same manifest.
license-files = [
    "kernels/LICENSE",
    "kernels/NOTICE",
    "kernels/LICENSE-cutlass",
    "kernels/LICENSE-flash-attention",
]
requires-python = ">=3.12"
dependencies = [
    "tensorfs>=0.25.0,<0.26",
    "msgspec>=0.19",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=12",
]

[dependency-groups]
# Pinned dev tooling: CI needs these on the venv, not behind an ad-hoc `--with` on
# every invocation.
dev = [
    "mypy>=1.13",
    "ruff>=0.16",
]
# The Diffusers integrations (fused glue, attention producers, Ulysses CP, LoRA composition).
# Packages declare their own.
diffusers = [
    "peft>=0.20,<0.21",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "torch>=2.15",
    "torchvision>=0.28",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"
cozy-native-wheel-proof = "cozy_runtime.cli.native_wheel_proof:main"

[build-system]
# The pure wheel and the sdist. `task wheel` makes each native wheel from the pure one plus that
# platform's kernel modules (kernels.yaml).
requires = ["hatchling"]
build-backend = "hatchling.build"

# Local dotenv files are not distribution source. VCS ignores also exclude task/output trees.
[tool.hatch.build.targets.sdist]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true

[tool.basedpyright]
# The editor's language server only; the required check is mypy (scripts/typecheck.sh).
include = ["src", "checks", "examples"]
extraPaths = ["src", "kernels/src", "examples/marco-polo"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingModuleSource = false  # the native kernel modules ship as stubs

# The required type check (scripts/typecheck.sh), against the real dependencies in
# scripts/typecheck-requirements.txt. `Any` is an error; one a third-party boundary needs carries
# `# type: ignore[explicit-any]  # <why>`. Known errors live in .mypy-baseline.txt, which only shrinks.
[tool.mypy]
python_version = "3.12"
files = ["src", "checks", "examples"]
explicit_package_bases = true
mypy_path = "src:checks:examples/marco-polo:kernels/src"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
implicit_reexport = false
# Not redundant-expr: a runtime check of a value from other code stays, though its type rules the value out.
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]
# torch leaves a few of its own functions unannotated (torch.cuda.Event(), is_initialized()).
untyped_calls_exclude = ["torch"]

# Untyped libraries (no py.typed): Triton, and `kernels` (cr-114), the image's loader for baked Hub
# kernels, which only executors have.
[[tool.mypy.overrides]]
module = ["triton", "triton.*", "kernels"]
ignore_missing_imports = true

# A @triton.jit kernel's `def` line and body are its Triton cache key (`TritonKernels.identity`): annotating one
# misses every prebuilt kernel. So the codes an untyped kernel def raises are off in the modules holding kernels,
# for the whole module (mypy has no per-function setting); every other check applies there.
[[tool.mypy.overrides]]
module = [
    "cozy_runtime.accel.kernels",
    "cozy_runtime.accel.moe._kernels",
    "cozy_runtime.internal.attention_fp8",
    "cozy_runtime.internal.attention_sage2_fixed_mean",
    "cozy_runtime.internal.attention_sage3_fixed",
    "cozy_runtime.internal.attention_sol_fa4",
    "cozy_runtime.internal.decode_cores",
    "cozy_runtime.internal.decode_schemes",
    "cozy_runtime.internal.kernel_sources",
    "cozy_runtime.internal.lora_bake",
    "cozy_runtime.internal.nvfp4_linear",
    "cozy_runtime.internal.parallel.turn",
    "cozy_runtime.internal.philox",
    "cozy_runtime.internal.sage3",
    "cozy_runtime.internal.svdq_linear",
    "cozy_runtime.lm._kernels",
]
disable_error_code = ["no-untyped-def", "no-any-unimported", "untyped-decorator"]
disallow_any_decorated = false
# A def line's own `# type: ignore` is part of its cache key too, so one these settings make unused stays.
warn_unused_ignores = false

# The same for the fusion kernels, whose bodies also call `.to` on what a kernel's `range` yields: a Triton
# tensor there, an int to mypy, and the body is the cache key, so it cannot carry an ignore.
[[tool.mypy.overrides]]
module = ["cozy_runtime.accel.fusion._kernels"]
disable_error_code = ["no-untyped-def", "no-any-unimported", "untyped-decorator", "attr-defined"]
disallow_any_decorated = false
warn_unused_ignores = false

[project.optional-dependencies]
assessment = ["cozy-eval>=0.7"]
# The derivation harness and the serving executor.
derive = ["torch>=2.15"]
media = [
    "av>=19.0.1",
]
# Executors read and place weights through TensorFS (`tensorfs`, `tensorfs.varena`). Local
# package environments select this capability; worker images provide the same range.
model-execution = ["tensorfs>=0.25.0,<0.26"]
# peft takes any transformers. Without these floors a resolver that picks huggingface-hub 2.x
# first backtracks to transformers 4.12, whose tokenizers has no wheel.
adapters = [
    "peft>=0.20,<0.21",
    "torch>=2.15",
    "transformers>=5.16.1",
    "tokenizers>=0.23.1",
]

[tool.ruff]
line-length = 100
src = ["src", "checks", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These aliases are reflected at runtime through typing.get_origin/get_args. PEP 695's
# TypeAliasType is deliberately not transparent and would change the package contract.
"src/cozy_runtime/author/_markers.py" = ["UP040"]

[project]
name = "cozy-runtime"
version = "0.43.1"
description = "Cozy author surface and device executor"
# The native wheels carry the kernels (`kernels/`): derived from comfy-kitchen, vLLM and SGLang
# (Apache-2.0, comfy-kitchen's NOTICE), with CUTLASS and FlashAttention-3 (BSD-3-Clause). The
# pure wheel ships the same manifest.
license-files = [
    "kernels/LICENSE",
    "kernels/NOTICE",
    "kernels/LICENSE-cutlass",
    "kernels/LICENSE-flash-attention",
]
requires-python = ">=3.12"
dependencies = [
    "tensorfs>=0.22.1,<0.23",
    "msgspec>=0.19",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=12",
]

[dependency-groups]
# Pinned dev tooling: CI needs these on the venv, not behind an ad-hoc `--with` on
# every invocation.
dev = [
    "mypy>=1.13",
    "ruff>=0.16",
]
# The Diffusers integrations (fused glue, attention producers, Ulysses CP, LoRA composition).
# Packages declare their own.
diffusers = [
    "peft>=0.20,<0.21",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "torch>=2.15",
    "torchvision>=0.28",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
]

[project.scripts]
cozy-runtime = "cozy_runtime.cli.main:main"
cozy-native-wheel-proof = "cozy_runtime.cli.native_wheel_proof:main"

[build-system]
# The pure wheel and the sdist. `task wheel` makes each native wheel from the pure one plus that
# platform's kernel modules (kernels.yaml).
requires = ["hatchling"]
build-backend = "hatchling.build"

# Local dotenv files are not distribution source. VCS ignores also exclude task/output trees.
[tool.hatch.build.targets.sdist]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_runtime"]

[tool.uv]
package = true

# rc/varena-v2 builds against its own TensorFS, which isn't published yet. The release drops this for the published
# TensorFS and sets the ranges above. To move it: new rev, then `uv lock`.
[tool.uv.sources]
tensorfs = { git = "https://github.com/cozy-creator/cozy-creator", rev = "a4f2f9545458efbb22cb3e0b36a110d21eb9a91d", subdirectory = "crates/tensorfs-py" }

[tool.basedpyright]
# The editor's language server only; the required check is mypy (scripts/typecheck.sh).
include = ["src", "checks", "examples"]
extraPaths = ["src", "kernels/src", "examples/marco-polo"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingModuleSource = false  # the native kernel modules ship as stubs

# The required type check (scripts/typecheck.sh), against the real dependencies in
# scripts/typecheck-requirements.txt. `Any` is an error; one a third-party boundary needs carries
# `# type: ignore[explicit-any]  # <why>`. Known errors live in .mypy-baseline.txt, which only shrinks.
[tool.mypy]
python_version = "3.12"
files = ["src", "checks", "examples"]
explicit_package_bases = true
mypy_path = "src:checks:examples/marco-polo:kernels/src"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
implicit_reexport = false
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]

# Untyped libraries (no py.typed): Triton, and `kernels` (cr-114), the image's loader for baked Hub
# kernels, which only executors have.
[[tool.mypy.overrides]]
module = ["triton", "triton.*", "kernels"]
ignore_missing_imports = true

[project.optional-dependencies]
assessment = ["cozy-eval>=0.7"]
# The derivation harness and the serving executor.
derive = ["torch>=2.15"]
media = [
    "av>=19.0.1",
]
# Executors read and place weights through TensorFS (`tensorfs`, `tensorfs.varena`). Local
# package environments select this capability; worker images provide the same range.
model-execution = ["tensorfs>=0.22.1,<0.23"]
# peft takes any transformers. Without these floors a resolver that picks huggingface-hub 2.x
# first backtracks to transformers 4.12, whose tokenizers has no wheel.
adapters = [
    "peft>=0.20,<0.21",
    "torch>=2.15",
    "transformers>=5.16.1",
    "tokenizers>=0.23.1",
]

[tool.ruff]
line-length = 100
src = ["src", "checks", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These aliases are reflected at runtime through typing.get_origin/get_args. PEP 695's
# TypeAliasType is deliberately not transparent and would change the package contract.
"src/cozy_runtime/author/_markers.py" = ["UP040"]

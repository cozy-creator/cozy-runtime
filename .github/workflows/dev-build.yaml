name: dev-build
# Builds runtime-publish.yaml's release files for any ref, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy-runtime -f ref=<sha> [-f build=pure]
# The artifact is cozy-runtime-<sha>[-aarch64]. The files carry the ref's pyproject version; the
# commit is stamped in cozy_runtime._build_provenance.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "wheels: sdist, pure wheel and the runner arch's Linux wheel with its kernels; pure: sdist and pure wheel"
        type: string
        default: wheels
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  # The runner arch's kernel modules, cached by everything that shapes their bytes (kernels.yaml).
  modules:
    if: ${{ inputs.build == 'wheels' }}
    uses: ./.github/workflows/kernels.yaml
    with:
      ref: ${{ inputs.ref }}
      linux: ${{ contains(inputs.runner, 'arm') && '["aarch64"]' || '["x86_64"]' }}
      windows: 'no'

  dev:
    needs: modules
    if: ${{ !cancelled() && needs.modules.result != 'failure' }}
    runs-on: ${{ inputs.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    env:
      WHEELS: ${{ inputs.build == 'wheels' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: source
      - id: pin
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      # An arm runner builds the locked TensorFS from its tag until TensorFS publishes aarch64 wheels.
      - working-directory: source
        run: |
          if [ "$RUNNER_ARCH" != ARM64 ]; then uv sync --locked; exit 0; fi
          uv sync --locked --no-install-package tensorfs
          version=$(grep -A1 '^name = "tensorfs"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          uv pip install "tensorfs @ git+https://github.com/cozy-creator/tensorfs@v$version"
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"
      # From here to the wheel check: runtime-publish.yaml's build job, step for step.
      # On either arch the Linux wheel is the pure one plus its kernels.
      - name: Build (sdist + pure-py wheel)
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.pin.outputs.sha }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          uv build --out-dir dist
      - if: env.WHEELS == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: kernels-linux-*
          path: kernels-out
          merge-multiple: true
      - name: The Linux wheel, the pure one plus its kernels
        if: env.WHEELS == 'true'
        working-directory: source
        run: task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out" PLAT="manylinux_2_28_$(uname -m)"
      - name: Verify wheel selection
        if: env.WHEELS == 'true'
        working-directory: source
        run: uv run --script scripts/verify-wheels.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-runtime-${{ steps.pin.outputs.sha }}${{ runner.arch == 'ARM64' && '-aarch64' || '' }}
          path: source/dist/
          if-no-files-found: error
          retention-days: 7

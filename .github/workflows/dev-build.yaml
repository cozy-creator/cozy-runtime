name: dev-build
# Builds runtime-publish.yaml's release files for any ref, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy-runtime -f ref=<sha> [-f build=pure]
# The artifact is cozy-runtime-<sha>[-aarch64]. The files are <pyproject version>+dev.g<sha8>, as
# cozy's dev builds are, so a release always replaces one (xs-129); the commit is stamped in
# cozy_runtime._build_provenance.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "wheels: release files; pure: sdist and pure wheel; xs170-candidate: hosted prepromotion SDK integration check"
        type: string
        default: wheels
      runner:
        description: A standard runner, free on this public repo
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        default: ubuntu-latest
      billed_runner:
        description: "A larger runner, named on purpose in place of runner. Never free (linux-x64-16core: $0.042/min, $2.52 a 60-min job) and the budget is about $10/day per org"
        type: string
        default: ''
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  # The runner arch's kernel modules, cached by everything that shapes their bytes (kernels.yaml).
  modules:
    if: ${{ inputs.build == 'wheels' }}
    uses: ./.github/workflows/kernels.yaml
    with:
      ref: ${{ inputs.ref }}
      linux: ${{ contains(inputs.billed_runner || inputs.runner, 'arm') && '["aarch64"]' || '["x86_64"]' }}
      windows: 'no'

  dev:
    needs: modules
    if: ${{ inputs.build != 'xs170-candidate' && !cancelled() && needs.modules.result != 'failure' }}
    runs-on: ${{ inputs.billed_runner || inputs.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    env:
      WHEELS: ${{ inputs.build == 'wheels' }}
    steps:
      - if: ${{ inputs.billed_runner != '' }}
        env:
          RUNNER: ${{ inputs.billed_runner }}
        run: echo "::warning::billed runner $RUNNER, never free; the budget is about \$10/day per org, and October passed it on 10-17 and 10-22 with these runs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: source
      - id: pin
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      # An arm runner builds the locked TensorFS from its tag until TensorFS publishes aarch64 wheels.
      - working-directory: source
        run: |
          if [ "$RUNNER_ARCH" != ARM64 ]; then uv sync --locked; exit 0; fi
          uv sync --locked --no-install-package tensorfs
          version=$(grep -A1 '^name = "tensorfs"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          uv pip install "tensorfs @ git+https://github.com/cozy-creator/tensorfs@v$version"
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"
      # From here to the wheel check: runtime-publish.yaml's build job, step for step.
      # On either arch the Linux wheel is the pure one plus its kernels.
      - name: Build (sdist + pure-py wheel)
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.pin.outputs.sha }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          sed -i "0,/^version = \"\(.*\)\"$/s//version = \"\1+dev.g${COZY_RUNTIME_BUILD_COMMIT:0:8}\"/" pyproject.toml
          grep -m1 '^version = ".*+dev\.g[0-9a-f]\{8\}"$' pyproject.toml
          uv build --out-dir dist
      - if: env.WHEELS == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: kernels-linux-*
          path: kernels-out
          merge-multiple: true
      # The Runtime's own Triton sets compiled for every card row, CPU-only, with the kernels job's
      # launcher modules (`triton_prebuild`); Triton's keys need a libcuda, here a stub.
      - name: The Runtime's Triton sets, prebuilt
        if: env.WHEELS == 'true'
        working-directory: source
        run: |
          set -o pipefail
          stub=$(mktemp -d)
          echo 'void cozy_libcuda_stub(void) {}' | cc -shared -x c -o "$stub/libcuda.so.1" -
          TRITON_LIBCUDA_PATH=$stub uv run --extra derive python -m cozy_runtime.internal.triton_prebuild \
            "$GITHUB_WORKSPACE/kernels-out/cozy_runtime/_triton" --launchers "$GITHUB_WORKSPACE/kernels-out/triton-launchers" \
            | tee "$RUNNER_TEMP/triton-prebuild.json"
          jq -c '{kernels, bytes, launchers}' "$RUNNER_TEMP/triton-prebuild.json" >> "$GITHUB_STEP_SUMMARY"
      - name: The Linux wheel, the pure one plus its kernels
        if: env.WHEELS == 'true'
        working-directory: source
        run: task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out" PLAT="manylinux_2_28_$(uname -m)"
      - name: Verify wheel selection
        if: env.WHEELS == 'true'
        working-directory: source
        run: uv run --script scripts/verify-wheels.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-runtime-${{ steps.pin.outputs.sha }}${{ runner.arch == 'ARM64' && '-aarch64' || '' }}
          path: source/dist/
          if-no-files-found: error
          retention-days: 7

  # Prepromotion source/SDK qualification; never publishes or mutates the registry.
  candidate:
    if: inputs.build == 'xs170-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SDK_RELEASE: https://github.com/cozy-creator/cozy-creator/releases/download/tensorfs-v0.24.2
      SDK_WHEEL: tensorfs-0.24.2-cp311-abi3-manylinux_2_28_x86_64.whl
      SDK_MANIFEST_SHA: c85b6d4291e06e04c84fa7d714fcd509aeb7f63b7653a2ecc859d44d49ddb664
      OLD_CANDIDATE_DIR: /home/fidika/cozy/.worktrees/cozy-runtime/xs170-sdk-cohort/.task/qualification/candidate-v0.24.2/assets
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Record source ownership and protected RC ancestry
        run: |
          mkdir -p "$RUNNER_TEMP/proof" "$RUNNER_TEMP/sdk-candidate"
          git merge-base --is-ancestor 810b2efdcb8e82abb75d979c70939e4a1e4c650a HEAD
          git merge-base --is-ancestor bf74de170508dc8cacb0c7b2a18c4d958c9c5c93 HEAD
          git log -1 --format='%H%n%an <%ae>%n%cn <%ce>' > "$RUNNER_TEMP/proof/source.txt"
          sha256sum .mypy-baseline.txt > "$RUNNER_TEMP/proof/baseline-before.sha256"
      - name: Download and verify the actual SDK candidate
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "$SDK_RELEASE/SHA256SUMS" -o "$RUNNER_TEMP/sdk-candidate/SHA256SUMS"
          printf '%s  %s\n' "$SDK_MANIFEST_SHA" "$RUNNER_TEMP/sdk-candidate/SHA256SUMS" | sha256sum -c -
          for file in "$SDK_WHEEL" tensorfs-0.24.2.tar.gz; do
            curl -fLsS --retry 3 "$SDK_RELEASE/$file" -o "$RUNNER_TEMP/sdk-candidate/$file"
            (cd "$RUNNER_TEMP/sdk-candidate" && grep -F " $file" SHA256SUMS | sha256sum -c -)
          done
          echo "UV_FIND_LINKS=$RUNNER_TEMP/sdk-candidate" >> "$GITHUB_ENV"
      - name: Materialize only the candidate paths in the prepromotion lock
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import tomllib
          path = Path('uv.lock')
          before = path.read_text()
          old = os.environ['OLD_CANDIDATE_DIR']
          new = str(Path(os.environ['RUNNER_TEMP']) / 'sdk-candidate')
          assert before.count(old) == 3
          after = before.replace(old, new)
          assert after.replace(new, old) == before
          assert [p for p in tomllib.loads(before)['package'] if p['name'] == 'tensorfs'][0]['version'] == '0.24.2'
          path.write_text(after)
          proof = {'source_lock_sha256': hashlib.sha256(before.encode()).hexdigest(),
                   'verification_lock_sha256': hashlib.sha256(after.encode()).hexdigest(),
                   'candidate_path_translation_only': True,
                   'registry_relock_required_before_merge': True}
          (Path(os.environ['RUNNER_TEMP']) / 'proof/lock-translation.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Normal locked sync, lint, compilation, import and strict typing
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff check --select E9,F63,F7,F82 --output-format github .
          uv run --locked python -m compileall -q src
          uv run --locked python -c "import cozy_runtime; print(cozy_runtime.__version__)"
          scripts/typecheck.sh | tee "$RUNNER_TEMP/proof/typecheck.log"
          sha256sum -c "$RUNNER_TEMP/proof/baseline-before.sha256"
      - name: Build the exact integrated source into its candidate wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/runtime-dist"
      - name: Installed old and integrated Runtime consumers
        run: |
          set -euo pipefail
          cpu_torch=$(sed -n 's/^torch @ /torch @ /p' scripts/typecheck-requirements.txt)
          test -n "$cpu_torch"
          for mode in old new; do
            uv venv --python 3.12 "$RUNNER_TEMP/$mode-runtime"
            runtime=cozy-runtime==0.45.0
            if [ "$mode" = new ]; then runtime=$(find "$RUNNER_TEMP/runtime-dist" -name '*.whl' -print -quit); fi
            uv pip install --python "$RUNNER_TEMP/$mode-runtime/bin/python" "$RUNNER_TEMP/sdk-candidate/$SDK_WHEEL" "$runtime" "$cpu_torch"
            "$RUNNER_TEMP/$mode-runtime/bin/python" -I checks/sdk_checkpoint_consumer.py --wheel "$RUNNER_TEMP/sdk-candidate/$SDK_WHEEL" --out "$RUNNER_TEMP/proof/$mode-runtime.json"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'proof'
          old = json.loads((root / 'old-runtime.json').read_text())
          new = json.loads((root / 'new-runtime.json').read_text())
          fields = ['tensorfs', 'native_extension_sha256', 'checkpoint', 'model_id', 'values', 'replay', 'wire_frame']
          assert all(old[key] == new[key] for key in fields)
          (root / 'consumer-comparison.json').write_text(json.dumps({'passed': True, 'equal_fields': fields}, indent=2) + '\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xs170-runtime-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof/
            ${{ runner.temp }}/runtime-dist/
          retention-days: 7

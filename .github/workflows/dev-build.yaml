name: dev-build
# Builds runtime-publish.yaml's release files for any ref, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy-runtime -f ref=<sha> [-f build=pure]
# The artifact is cozy-runtime-<sha>[-aarch64]. The files are <pyproject version>+dev.g<sha8>, or the `version` a
# caller names (rc-dev.yaml: the open RC's 0.47.0.dev<n>+g<sha8>, cl-952), as
# cozy's dev builds are, so a release always replaces one (xs-129); the commit is stamped in
# cozy_runtime._build_provenance.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "wheels: release files; pure: sdist and pure wheel; model-sdk: published SDK identity/replay protocol checks"
        type: string
        default: wheels
      runner:
        description: A standard runner, free on this public repo
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        default: ubuntu-latest
      billed_runner:
        description: "A larger runner, named on purpose in place of runner. Never free (linux-x64-16core: $0.042/min, $2.52 a 60-min job) and the budget is about $10/day per org"
        type: string
        default: ''
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
      version:
        description: "The files' version in place of <pyproject version>+dev.g<sha8> (rc-dev.yaml: 0.47.0.dev<n>+g<sha8>)"
        type: string
        default: ''
  # rc-dev.yaml's builds.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      build:
        type: string
        default: wheels
      runner:
        type: string
        default: ubuntu-latest
      billed_runner:
        type: string
        default: ''
      nonce:
        type: string
        default: ''
      version:
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  # The runner arch's kernel modules, cached by everything that shapes their bytes (kernels.yaml).
  modules:
    if: ${{ inputs.build == 'wheels' }}
    uses: ./.github/workflows/kernels.yaml
    with:
      ref: ${{ inputs.ref }}
      linux: ${{ contains(inputs.billed_runner || inputs.runner, 'arm') && '["aarch64"]' || '["x86_64"]' }}
      windows: 'no'

  dev:
    needs: modules
    if: ${{ inputs.build != 'model-sdk' && !cancelled() && needs.modules.result != 'failure' }}
    runs-on: ${{ inputs.billed_runner || inputs.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    env:
      WHEELS: ${{ inputs.build == 'wheels' }}
    steps:
      - if: ${{ inputs.billed_runner != '' }}
        env:
          RUNNER: ${{ inputs.billed_runner }}
        run: echo "::warning::billed runner $RUNNER, never free; the budget is about \$10/day per org, and October passed it on 10-17 and 10-22 with these runs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: source
      - id: pin
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      # An arm runner builds the locked TensorFS from its tag until TensorFS publishes aarch64 wheels.
      - working-directory: source
        run: |
          if [ "$RUNNER_ARCH" != ARM64 ]; then uv sync --locked; exit 0; fi
          uv sync --locked --no-install-package tensorfs
          version=$(grep -A1 '^name = "tensorfs"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          uv pip install "tensorfs @ git+https://github.com/cozy-creator/tensorfs@v$version"
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"
      # From here to the wheel check: runtime-publish.yaml's build job, step for step.
      # On either arch the Linux wheel is the pure one plus its kernels.
      - name: Build (sdist + pure-py wheel)
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.pin.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          if [ -n "$VERSION" ]; then
            sed -i "0,/^version = \"\(.*\)\"$/s//version = \"$VERSION\"/" pyproject.toml
            grep -m1 -F "version = \"$VERSION\"" pyproject.toml
          else
            sed -i "0,/^version = \"\(.*\)\"$/s//version = \"\1+dev.g${COZY_RUNTIME_BUILD_COMMIT:0:8}\"/" pyproject.toml
            grep -m1 '^version = ".*+dev\.g[0-9a-f]\{8\}"$' pyproject.toml
          fi
          uv build --out-dir dist
      - if: env.WHEELS == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: kernels-linux-*
          path: kernels-out
          merge-multiple: true
      # The Runtime's own Triton sets compiled for every card row, CPU-only, with the kernels job's
      # launcher modules (`triton_prebuild`); Triton's keys need a libcuda, here a stub.
      - name: The Runtime's Triton sets, prebuilt
        if: env.WHEELS == 'true'
        working-directory: source
        run: |
          set -o pipefail
          stub=$(mktemp -d)
          echo 'void cozy_libcuda_stub(void) {}' | cc -shared -x c -o "$stub/libcuda.so.1" -
          TRITON_LIBCUDA_PATH=$stub uv run --extra derive python -m cozy_runtime.internal.triton_prebuild \
            "$GITHUB_WORKSPACE/kernels-out/cozy_runtime/_triton" --launchers "$GITHUB_WORKSPACE/kernels-out/triton-launchers" \
            | tee "$RUNNER_TEMP/triton-prebuild.json"
          jq -c '{kernels, bytes, launchers}' "$RUNNER_TEMP/triton-prebuild.json" >> "$GITHUB_STEP_SUMMARY"
      - name: The Linux wheel, the pure one plus its kernels
        if: env.WHEELS == 'true'
        working-directory: source
        run: task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out" PLAT="manylinux_2_28_$(uname -m)"
      - name: Verify wheel selection
        if: env.WHEELS == 'true'
        working-directory: source
        run: uv run --script scripts/verify-wheels.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-runtime-${{ steps.pin.outputs.sha }}${{ runner.arch == 'ARM64' && '-aarch64' || '' }}
          path: source/dist/
          if-no-files-found: error
          retention-days: 7

  model-sdk:
    if: inputs.build == 'model-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.24.0', '0.24.1']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Normal registry-locked and strict source checks
        run: |
          uv sync --locked
          uv run --locked ruff check --select E9,F63,F7,F82 .
          uv run --locked python -m compileall -q src
          uv run --locked python -c 'import cozy_runtime'
          scripts/typecheck.sh
      - name: Install the actual Runtime candidate and selected published SDK
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          mkdir -p proof
          uv build --wheel --out-dir "$RUNNER_TEMP/runtime-wheel"
          uv pip install --python .venv-typecheck/bin/python --no-deps "$RUNNER_TEMP"/runtime-wheel/*.whl "tensorfs==$SDK_VERSION"
          .venv-typecheck/bin/python -c 'import importlib.metadata as m; import os; assert m.version("tensorfs") == os.environ["SDK_VERSION"]'
      - name: Actual installed output, replay and executor frame
        run: |
          .venv-typecheck/bin/python -I checks/model_identity_consumer.py --out proof/model-identity.json
          .venv-typecheck/bin/mypy --python-executable .venv-typecheck/bin/python --no-error-summary --no-pretty --show-error-codes > proof/typecheck.txt || status=$?
          test "${status:-0}" -le 1
          .venv-typecheck/bin/python scripts/typecheck.py check < proof/typecheck.txt
          sha256sum "$RUNNER_TEMP"/runtime-wheel/*.whl > proof/runtime-wheel.sha256
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-model-identity-sdk-${{ matrix.sdk }}-${{ github.sha }}
          path: proof/
          if-no-files-found: warn
          retention-days: 14

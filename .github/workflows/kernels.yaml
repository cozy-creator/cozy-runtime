name: kernels
# The cozy-kernels wheels (`kernels/`): every prebuilt kernel for every GPU target, one wheel per
# OS and CPU, each checked for its tag, its declared targets, no torch and an import on every
# Python it claims (checks/kernel_wheel.py). PRs that touch kernel sources run it. By hand:
#   gh workflow run kernels.yaml -R cozy-creator/cozy-runtime -f ref=<tag|sha>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  pull_request:
    paths:
      - kernels/**
      - src/cozy_runtime/internal/int8_op/**
      - checks/kernel_wheel.py
      - .github/workflows/kernels.yaml
run-name: kernels ${{ inputs.ref || github.head_ref || github.ref_name }}

permissions:
  contents: read

# A newer push to the same ref replaces a build still running.
concurrency:
  group: kernels-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUTLASS units peak at ~6 GB each: compile jobs sized by the runner's memory.
          - {arch: x86_64, cuda: x86_64, runner: linux-x64-16core, jobs: 6, fa3: 'ON'}
          # The arm64 larger runner has no docker; the standard one does. Its ptxas crashes on
          # FA3's units (signal 11, twice): this wheel ships without `_fa3` (cr-200).
          - {arch: aarch64, cuda: sbsa, runner: ubuntu-24.04-arm, jobs: 1, fa3: 'OFF'}
    runs-on: ${{ matrix.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 240
    env:
      # glibc 2.28 and gcc-toolset-14: the wheel's floor is the floor it was compiled on.
      IMAGE: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:2026.10.10-1
      PLAT: manylinux_2_28_${{ matrix.arch }}
      CUDA_REPO: https://developer.download.nvidia.com/compute/cuda/repos/rhel8/${{ matrix.cuda }}/cuda-rhel8.repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build and check the wheel
        run: |
          # TensorD's driver floor (public cozy repo), which the wheel's must equal.
          curl -fsSL https://raw.githubusercontent.com/cozy-creator/cozy/master/crates/cozy-platform/src/gpu/mod.rs \
            -o platform-gpu.rs
          docker run --rm -v "$PWD:/src" -w /src -e PLAT -e CUDA_REPO -e HOST_OWNER="$(id -u):$(id -g)" \
            -e FA3=${{ matrix.fa3 }} -e CMAKE_BUILD_PARALLEL_LEVEL=${{ matrix.jobs }} "$IMAGE" bash -euo pipefail -c '
              dnf install -y -q dnf-plugins-core && dnf config-manager --add-repo "$CUDA_REPO"
              dnf install -y -q cuda-nvcc-13-0-13.0.88 cuda-cudart-devel-13-0-13.0.96 cuda-cuobjdump-13-0-13.0.85
              export PATH=/usr/local/cuda-13.0/bin:$PATH
              export CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
              py=/opt/python/cp312-cp312/bin/python
              $py -m pip install -q uv==0.12.7
              time $py -m uv build --wheel --python $py --out-dir /tmp/raw -C cmake.define.COZY_FA3=$FA3 \
                kernels
              auditwheel repair --plat "$PLAT" --only-plat -w dist /tmp/raw/*.whl
              $py checks/kernel_wheel.py dist/*.whl "$PLAT" --python $py \
                --python /opt/python/cp313-cp313/bin/python --python /opt/python/cp314-cp314/bin/python \
                --platform-floor platform-gpu.rs $([ "$FA3" = ON ] || echo --without _fa3)
              chown -R "$HOST_OWNER" dist
            ' 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      - uses: astral-sh/setup-uv@v7
      - name: Stable ABI only
        run: uvx abi3audit==0.0.26 --strict --report dist/*.whl
      - if: always()
        run: grep -E '^(_gemm|FAILED|cozy_kernels|real)' build.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-kernels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    # No larger Windows runner: the standard one, one compile at a time.
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      REDIST: https://developer.download.nvidia.com/compute/cuda/redist
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - {uses: actions/setup-python@v5, id: py313, with: {python-version: '3.13'}}
      - {uses: actions/setup-python@v5, id: py314, with: {python-version: '3.14'}}
      - {uses: actions/setup-python@v5, id: py312, with: {python-version: '3.12'}}
      # CUDA 13.0's host_config.h takes MSVC through 19.4x: the image's Visual Studio 2026 carries
      # Visual Studio 2022's last toolset, 14.44.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          toolset: '14.44'
      - name: CUDA 13.0 from NVIDIA's redistributables, each archive held to its digest
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod "$env:REDIST/redistrib_13.0.2.json"
          $root = "$env:RUNNER_TEMP\cuda"
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($name in "cuda_nvcc", "cuda_crt", "libnvvm", "cuda_cudart", "cuda_cccl", "cuda_cuobjdump") {
            $entry = $manifest.$name."windows-x86_64"
            Invoke-WebRequest "$env:REDIST/$($entry.relative_path)" -OutFile "$name.zip"
            if ((Get-FileHash "$name.zip" -Algorithm SHA256).Hash -ne $entry.sha256.ToUpper()) { throw "$name digest" }
            Expand-Archive "$name.zip" "$env:RUNNER_TEMP\x\$name"
            Copy-Item "$env:RUNNER_TEMP\x\$name\*\*" $root -Recurse -Force
          }
          "$root\bin" >> $env:GITHUB_PATH
          "CUDAToolkit_ROOT=$root" >> $env:GITHUB_ENV
          "CUDA_PATH=$root" >> $env:GITHUB_ENV
      - name: Build and check the wheel
        shell: pwsh
        run: |
          $py = "${{ steps.py312.outputs.python-path }}"
          & $py -m pip install -q uv==0.12.7
          Invoke-WebRequest https://raw.githubusercontent.com/cozy-creator/cozy/master/crates/cozy-platform/src/gpu/mod.rs -OutFile platform-gpu.rs
          $began = Get-Date
          & $py -m uv build --wheel --python $py --out-dir dist kernels
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "built in $(((Get-Date) - $began).TotalMinutes) min"
          $wheel = (Get-ChildItem dist\*.whl).FullName
          & $py checks/kernel_wheel.py $wheel win_amd64 --python $py `
            --python "${{ steps.py313.outputs.python-path }}" --python "${{ steps.py314.outputs.python-path }}" `
            --platform-floor platform-gpu.rs
          exit $LASTEXITCODE
      - uses: astral-sh/setup-uv@v7
      - name: Stable ABI only
        run: uvx abi3audit==0.0.26 --strict --report (Get-ChildItem dist\*.whl).FullName
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-kernels-win_amd64
          path: dist/*.whl
          if-no-files-found: error


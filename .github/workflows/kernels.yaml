name: kernels
# Cozy's prebuilt kernels (`kernels/`): the modules each native cozy-runtime wheel carries under
# `cozy_runtime/_kernels`, one set per OS and CPU, each held to its declared targets, imports and a
# call without a GPU (checks/kernel_modules.py). publish.yaml and dev-build.yaml call this and
# repackage the artifact `kernels-<target>` into their wheels (`task wheel`). By hand:
#   gh workflow run kernels.yaml -R cozy-creator/cozy-runtime -f ref=<tag|sha>
#
# Built modules are cached under a key of everything that shapes their bytes: `kernels/**`
# (sources, flags, targets, toolchain.env's pins), the catalog and checker they are held to, the
# target, Windows' exact compiler and this recipe's revision (`kernels-r1`; bump it when a build
# step below changes). Only that exact key is ever restored: a miss compiles. Master's runs warm
# the cache releases read.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      linux:
        description: The Linux CPUs to build for, a JSON list
        type: string
        default: '["x86_64", "aarch64"]'
      windows:
        description: "Whether to build for Windows x86_64: yes or no"
        type: string
        default: 'yes'
  pull_request:
    paths: &inputs
      - kernels/**
      - src/cozy_runtime/_kernels/__init__.py
      - checks/kernel_modules.py
      - .github/workflows/kernels.yaml
  push:
    branches: [master]
    paths: *inputs
run-name: kernels ${{ inputs.ref || github.head_ref || github.ref_name }}

permissions:
  contents: read

# A newer push to the same ref replaces a build still running; a caller's build is its own.
concurrency:
  group: kernels-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ inputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.linux || '["x86_64", "aarch64"]') }}
    # CUTLASS units peak at ~6 GB each: compile jobs sized by the runner's memory. The arm64 larger
    # runner has no docker; the standard one does.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'linux-x64-16core' }}
    # Hang bound, not a work budget.
    timeout-minutes: 240
    env:
      ARCH: ${{ matrix.arch }}
      JOBS: ${{ matrix.arch == 'aarch64' && 1 || 6 }}
      # ptxas on an arm64 host crashes on FA3's units (signal 11, cr-200): CMake builds none there.
      WITHOUT: ${{ matrix.arch == 'aarch64' && '_fa3' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: key
        run: |
          grep -v '^#' kernels/toolchain.env >> "$GITHUB_ENV"
          echo "key=kernels-r1-linux-$ARCH-${{ hashFiles('kernels/**', 'src/cozy_runtime/_kernels/__init__.py', 'checks/kernel_modules.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: modules
          key: ${{ steps.key.outputs.key }}
      - name: Build and check the modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # TensorD's driver floor (public cozy repo), which the modules' must equal.
          curl -fsSL https://raw.githubusercontent.com/cozy-creator/cozy-creator/master/crates/platform/src/gpu/mod.rs \
            -o platform-gpu.rs
          # glibc 2.28 and gcc-toolset-14: the wheels' floor is the floor the modules compile on.
          docker run --rm -v "$PWD:/src" -w /src --env-file <(grep -v '^#' kernels/toolchain.env) \
            -e ARCH -e JOBS -e WITHOUT -e HOST_OWNER="$(id -u):$(id -g)" \
            "quay.io/pypa/manylinux_2_28_$ARCH:$MANYLINUX" bash -euo pipefail -c '
              cuda=$([ "$ARCH" = aarch64 ] && echo sbsa || echo x86_64)
              dnf install -y -q dnf-plugins-core
              dnf config-manager --add-repo "https://developer.download.nvidia.com/compute/cuda/repos/rhel8/$cuda/cuda-rhel8.repo"
              dnf install -y -q "cuda-nvcc-13-0-$CUDA_NVCC" "cuda-cudart-devel-13-0-$CUDA_CUDART" \
                "cuda-cuobjdump-13-0-$CUDA_CUOBJDUMP"
              export PATH=/opt/python/cp312-cp312/bin:/usr/local/cuda-13.0/bin:$PATH
              export CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
              python -m pip install -q --root-user-action ignore "nanobind==$NANOBIND" "cmake==$CMAKE" "ninja==$NINJA"
              time cmake -S kernels -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(command -v python)"
              time cmake --build /tmp/build --parallel "$JOBS"
              cmake --install /tmp/build --prefix modules
              # CPU torch, which each module must load before: none may export what it binds.
              python -m pip install -q --root-user-action ignore "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu
              python checks/kernel_modules.py modules --python python \
                --python /opt/python/cp313-cp313/bin/python --python /opt/python/cp314-cp314/bin/python \
                --platform-floor platform-gpu.rs --torch-python python $(for w in $WITHOUT; do echo --without $w; done)
              chown -R "$HOST_OWNER" modules
            ' 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7
      - name: Stable ABI only
        if: steps.cache.outputs.cache-hit != 'true'
        run: uvx abi3audit==0.0.26 --strict --report --assume-minimum-abi3 3.12 modules/cozy_runtime/_kernels/*.so
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: modules
          key: ${{ steps.key.outputs.key }}
      - if: always()
        run: |
          echo "${{ steps.key.outputs.key }}: ${{ steps.cache.outputs.cache-hit == 'true' && 'cached' || 'built' }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(_gemm|_fa3|_norm|FAILED|real)' build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: kernels-linux-${{ matrix.arch }}
          path: modules/
          if-no-files-found: error

  windows:
    # A push or pull request carries no inputs, and builds every target.
    if: ${{ inputs.windows != 'no' }}
    # No larger Windows runner: the standard one, one compile at a time.
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      REDIST: https://developer.download.nvidia.com/compute/cuda/redist
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - shell: bash
        run: grep -v '^#' kernels/toolchain.env >> "$GITHUB_ENV"
      - {uses: actions/setup-python@v5, id: py313, with: {python-version: '3.13'}}
      - {uses: actions/setup-python@v5, id: py314, with: {python-version: '3.14'}}
      - {uses: actions/setup-python@v5, id: py312, with: {python-version: '3.12'}}
      # The image's Visual Studio 2026 carries Visual Studio 2022's last toolset.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          toolset: ${{ env.MSVC_TOOLSET }}
      - id: key
        shell: bash
        run: |
          cl=$(cl 2>&1 | grep -o 'Version [0-9.]*' | cut -d' ' -f2)
          echo "key=kernels-r1-win_amd64-msvc$cl-${{ hashFiles('kernels/**', 'src/cozy_runtime/_kernels/__init__.py', 'checks/kernel_modules.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: modules
          key: ${{ steps.key.outputs.key }}
      - name: CUDA from NVIDIA's redistributables, each archive held to its digest
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod "$env:REDIST/redistrib_$env:CUDA_REDIST.json"
          $root = "$env:RUNNER_TEMP\cuda"
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($name in "cuda_nvcc", "cuda_crt", "libnvvm", "cuda_cudart", "cuda_cccl", "cuda_cuobjdump") {
            $entry = $manifest.$name."windows-x86_64"
            Invoke-WebRequest "$env:REDIST/$($entry.relative_path)" -OutFile "$name.zip"
            if ((Get-FileHash "$name.zip" -Algorithm SHA256).Hash -ne $entry.sha256.ToUpper()) { throw "$name digest" }
            Expand-Archive "$name.zip" "$env:RUNNER_TEMP\x\$name"
            Copy-Item "$env:RUNNER_TEMP\x\$name\*\*" $root -Recurse -Force
          }
          "$root\bin" >> $env:GITHUB_PATH
          "CUDAToolkit_ROOT=$root" >> $env:GITHUB_ENV
          "CUDA_PATH=$root" >> $env:GITHUB_ENV
      - name: Build and check the modules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $py = "${{ steps.py312.outputs.python-path }}"
          & $py -m pip install -q "nanobind==$env:NANOBIND" "cmake==$env:CMAKE" "ninja==$env:NINJA"
          $env:PATH = "$(Split-Path $py)\Scripts;$env:PATH"
          Invoke-WebRequest https://raw.githubusercontent.com/cozy-creator/cozy-creator/master/crates/platform/src/gpu/mod.rs -OutFile platform-gpu.rs
          $began = Get-Date
          cmake -S kernels -B "$env:RUNNER_TEMP\build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPython_EXECUTABLE=$py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP\build" --parallel 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install "$env:RUNNER_TEMP\build" --prefix modules
          "built in $(((Get-Date) - $began).TotalMinutes) min"
          & $py -m pip install -q "torch==$env:TORCH" --index-url https://download.pytorch.org/whl/cpu
          # MSVC builds neither CUTLASS's TMA GEMMs nor FA3 (cr-201).
          & $py checks/kernel_modules.py modules --without tma --without _fa3 --python $py `
            --python "${{ steps.py313.outputs.python-path }}" --python "${{ steps.py314.outputs.python-path }}" `
            --platform-floor platform-gpu.rs --torch-python $py
          exit $LASTEXITCODE
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7
      - name: Stable ABI only
        if: steps.cache.outputs.cache-hit != 'true'
        run: uvx abi3audit==0.0.26 --strict --report --assume-minimum-abi3 3.12 (Get-ChildItem modules\cozy_runtime\_kernels\*.pyd).FullName
        shell: pwsh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: modules
          key: ${{ steps.key.outputs.key }}
      - if: always()
        shell: bash
        run: |
          echo "${{ steps.key.outputs.key }}: ${{ steps.cache.outputs.cache-hit == 'true' && 'cached' || 'built' }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kernels-win_amd64
          path: modules/
          if-no-files-found: error

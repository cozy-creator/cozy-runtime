name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet -e .
      - run: python3 -c "import cozy_runtime, cozy_runtime.author, cozy_runtime.internal; print(cozy_runtime.__version__)"
      - run: python3 scripts/fence.py

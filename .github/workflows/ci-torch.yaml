name: ci-torch
# On demand only (CPU torch install + torch-dependent tests):
#   gh workflow run ci-torch.yaml -R cozy-creator/cozy-runtime --ref <branch>
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  torch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # The UID proof runs Python as another user; the runner's private temp dir is not traversable.
      UV_PYTHON_INSTALL_DIR: /tmp/cozy-runtime-ci-python
    steps:
      - uses: actions/checkout@v4
      - run: install -d -m 0755 "$UV_PYTHON_INSTALL_DIR"
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv pip install --python .venv/bin/python --index https://download.pytorch.org/whl/cpu "torch==2.14.0"
      - run: uv pip install --python .venv/bin/python "diffusers==0.40.0" "accelerate==1.14.0" "transformers==5.16.1"
      - run: .venv/bin/python -c "import torch; assert torch.version.cuda is None"
      - run: >-
          .venv/bin/python -m pytest tests/test_parallel_calls.py tests/test_attention_sol.py
          tests/test_h3_group_warm_fixture.py
          tests/test_job_source_derivation.py tests/test_construction_dtype.py
          tests/test_h3_conditioner_lifecycle.py tests/test_gpu_job_device.py
          tests/test_prepare_diagnostics.py
          tests/test_encoded_leaf_dtype.py
          tests/test_h3_sol_prefix.py tests/test_h3_sol_turbo.py
          tests/test_h3_reference_audio.py
          tests/test_end_to_end.py::test_real_modeled_package_prepare_can_be_acquired_before_model_selection -q -rs
      - name: Pod executor UID boundary during warmup
        run: |
          proof_root=$(mktemp -d /tmp/cozy-runtime-uid.XXXXXX)
          trap 'sudo rm -rf "$proof_root"' EXIT
          chmod 0755 "$proof_root"
          uv build --wheel --out-dir "$proof_root/wheels"
          uv venv --python 3.12 "$proof_root/.venv"
          UV_LINK_MODE=copy uv pip install --python "$proof_root/.venv/bin/python" "$proof_root"/wheels/*.whl pytest
          UV_LINK_MODE=copy uv pip install --python "$proof_root/.venv/bin/python" --index https://download.pytorch.org/whl/cpu "torch==2.14.0"
          cp -a tests "$proof_root/"
          cd "$proof_root"
          sudo -E .venv/bin/python -m pytest tests/test_warm_isolation.py -q -rs

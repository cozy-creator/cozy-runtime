name: runtime-publish

# Explicit publication only: creating a tag never starts a companion source build. Nothing reaches PyPI before its
# release gate passed (cozy-creator release-gate/, tracker design ci-v2, pre-release and promotion):
#   Candidate: build the tag into its GitHub prerelease (the files, SHA256SUMS), no PyPI. The gate takes its Linux
#   x86_64 wheel by URL#sha256:
#     gh workflow run runtime-publish.yaml -f release_tag=vX.Y.Z -f mode=source
#   Promotion: exactly those release assets to PyPI, given the passing gate the release agent recorded (testing is
#   manual): a cozy-creator release-gate.yml run id, or the URL of a recorded hand gate. PyPI's trusted publisher
#   names this file:
#     gh workflow run runtime-publish.yaml -f release_tag=vX.Y.Z -f mode=prebuilt -f gated_sha256sums='<sha256> <filename> ...' -f gate_run=<id>
# A release may ship in parts when one platform cannot build: -f linux='["x86_64"]' releases the sdist, pure, x86_64
# and Windows files (aarch64 resolves the pure wheel); later -f linux='["aarch64"]' builds and publishes only its wheel
# into the same version, both modes, a prebuilt part taking a hand-gate record URL.
# Add -f rehearsal=true to verify a tag/files without entering the publish job.
# Build/download jobs have read-only repository access. Only publish obtains PyPI OIDC.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished version tag to publish
        type: string
        required: true
      mode:
        description: Build from the tag or use approved existing release assets
        type: choice
        required: true
        default: source
        options:
          - source
          - prebuilt
      rehearsal:
        description: Verify only; allow an existing PyPI version and never publish
        type: boolean
        default: false
      gated_sha256sums:
        description: '"<sha256> <filename>" pairs, space separated: publish exactly these release assets, no build'
        type: string
        default: ''
      gate_run:
        description: "prebuilt: the passing cozy-creator release-gate run id, or the URL of a recorded hand gate"
        type: string
        default: ''
      linux:
        description: 'The Linux CPUs this part releases, a JSON list; x86_64 also carries the sdist, pure and Windows files; without it the part adds to a released version'
        type: string
        default: '["x86_64", "aarch64"]'

# Serialize retries for one release name; distinct versions can build independently.
concurrency:
  group: runtime-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # The kernel modules for each native wheel: cached by everything that shapes their bytes, built
  # only when that changed (kernels.yaml).
  modules:
    if: ${{ inputs.mode == 'source' }}
    uses: ./.github/workflows/kernels.yaml
    with:
      ref: ${{ inputs.release_tag }}
      linux: ${{ inputs.linux }}
      windows: ${{ contains(fromJSON(inputs.linux), 'x86_64') && 'yes' || 'no' }}

  build:
    needs: modules
    if: ${{ inputs.mode == 'source' && contains(fromJSON(inputs.linux), 'x86_64') }}
    outputs:
      version: ${{ steps.dist.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    runs-on: ubuntu-latest
    # Hang bound, not a work budget: a native-input change adds image pull + CUDA toolkit +
    # six-architecture compile.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
        with:
          # A tag-scoped cache is never restored by another tag.
          save-cache: false
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      - name: Source mode carries no prebuilt asset selection
        env:
          SUMS: ${{ inputs.gated_sha256sums }}
        run: |
          if [ -n "$SUMS" ]; then
            echo "::error::Use mode=prebuilt when supplying gated_sha256sums."
            exit 1
          fi
      - id: release
        name: Verify immutable release identity
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source ${{ inputs.rehearsal && '--rehearsal' || '' }}
      - run: uv sync --locked
        working-directory: source
      # The pure wheel remains the portable macOS and source-build artifact.
      - name: Build (sdist + pure-py wheel)
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.release.outputs.source }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          uv build --out-dir dist
      - uses: actions/download-artifact@v4
        with:
          pattern: kernels-*
          path: kernels-out
      # The Runtime's own Triton sets compiled for every card row, CPU-only, with the kernels job's
      # launcher modules (`triton_prebuild`); Triton's keys need a libcuda, here a stub.
      - name: The Runtime's Triton sets, prebuilt
        working-directory: source
        run: |
          set -o pipefail
          stub=$(mktemp -d)
          echo 'void cozy_libcuda_stub(void) {}' | cc -shared -x c -o "$stub/libcuda.so.1" -
          TRITON_LIBCUDA_PATH=$stub uv run --extra derive python -m cozy_runtime.internal.triton_prebuild \
            "$GITHUB_WORKSPACE/kernels-out/kernels-linux-x86_64/cozy_runtime/_triton" --launchers "$GITHUB_WORKSPACE/kernels-out/kernels-linux-x86_64/triton-launchers"
      - name: The x86_64 and Windows wheels, the pure one plus their kernels
        working-directory: source
        run: |
          task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out/kernels-linux-x86_64" PLAT=manylinux_2_28_x86_64
          task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out/kernels-win_amd64" PLAT=win_amd64
      - name: Verify wheel selection
        working-directory: source
        run: uv run --script scripts/verify-wheels.py --dist dist
      # cr-095: a release silently missing a platform file is refused.
      # Everything visible in dist/ is uploaded, so the set is exact; the digests travel to
      # `publish` outside the artifact.
      - id: dist
        name: Release carries the sdist, portable wheel, and the x86_64 and Windows wheels
        working-directory: source
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, os, pathlib, sys, tomllib
          v = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          want = {
              f"cozy_runtime-{v}.tar.gz",
              f"cozy_runtime-{v}-py3-none-any.whl",
              f"cozy_runtime-{v}-cp312-abi3-manylinux_2_28_x86_64.whl",
              f"cozy_runtime-{v}-cp312-abi3-win_amd64.whl",
          }
          dist = pathlib.Path("dist")
          # uv writes dist/.gitignore; hidden files are neither uploaded nor published.
          have = {p.name for p in dist.iterdir() if not p.name.startswith(".")}
          if have != want:
              sys.exit(f"dist is not the release set\n  missing: {sorted(want - have)}\n  extra:   {sorted(have - want)}")
          sums = "\n".join(
              f"{hashlib.sha256((dist / name).read_bytes()).hexdigest()}  {name}" for name in sorted(want)
          )
          print(sums)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\nsha256sums<<SUMS\n{sums}\nSUMS\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: source/dist/
          if-no-files-found: error

  # The Linux arm64 wheel, on its own runner: the pure wheel plus its kernels.
  build-aarch64:
    needs: modules
    if: ${{ inputs.mode == 'source' && contains(fromJSON(inputs.linux), 'aarch64') }}
    outputs:
      sha256sum: ${{ steps.dist.outputs.sha256sum }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      - id: release
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source ${{ inputs.rehearsal && '--rehearsal' || '' }} ${{ !contains(fromJSON(inputs.linux), 'x86_64') && '--adding' || '' }}
      - run: uv sync --locked
        working-directory: source
      - uses: actions/download-artifact@v4
        with:
          name: kernels-linux-aarch64
          path: kernels-out
      # The Runtime's own Triton sets compiled for every card row, CPU-only, with the kernels job's
      # launcher modules (`triton_prebuild`); Triton's keys need a libcuda, here a stub.
      - name: The Runtime's Triton sets, prebuilt
        working-directory: source
        run: |
          set -o pipefail
          stub=$(mktemp -d)
          echo 'void cozy_libcuda_stub(void) {}' | cc -shared -x c -o "$stub/libcuda.so.1" -
          TRITON_LIBCUDA_PATH=$stub uv run --extra derive python -m cozy_runtime.internal.triton_prebuild \
            "$GITHUB_WORKSPACE/kernels-out/cozy_runtime/_triton" --launchers "$GITHUB_WORKSPACE/kernels-out/triton-launchers"
      - name: Pure wheel and its kernels, verified
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.release.outputs.source }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          uv build --wheel --out-dir dist
          task wheel KERNELS="$GITHUB_WORKSPACE/kernels-out" PLAT=manylinux_2_28_aarch64
          uv run --script scripts/verify-wheels.py --dist dist
      - id: dist
        working-directory: source/dist
        run: |
          rm -- *-py3-none-any.whl
          echo "sha256sum=$(sha256sum -- *.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-aarch64
          path: source/dist/*.whl
          if-no-files-found: error

  # The gated files a release candidate was proven with, byte for byte: the release's assets,
  # refused unless they are exactly the sums the release owner recorded. No artifact code runs.
  gated:
    if: ${{ inputs.mode == 'prebuilt' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: release
        name: Verify immutable release identity without executing artifact code
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source ${{ inputs.rehearsal && '--rehearsal' || '' }} ${{ !contains(fromJSON(inputs.linux), 'x86_64') && '--adding' || '' }}
      - name: The release gate passed these files
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ inputs.gate_run }}
          SUMS: ${{ inputs.gated_sha256sums }}
        run: |
          set -euo pipefail
          case $GATE in
            https://*) echo "gated by hand, recorded at $GATE" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *[!0-9]* | '') echo "::error::Prebuilt mode requires gate_run: a release-gate run id or a record URL"; exit 1 ;;
            *) git clone -q --depth 1 https://github.com/cozy-creator/cozy-creator creator
               sha=$(creator/release-gate/verify.sh "$GATE" | jq -r .runtime_sha256)
               [ -n "$sha" ] && grep -qw "$sha" <<< "$SUMS" || { echo "::error::gate $GATE ran no file of $SUMS"; exit 1; } ;;
          esac
      - id: dist
        name: The release holds exactly the approved files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SUMS: ${{ inputs.gated_sha256sums }}
          LINUX: ${{ inputs.linux }}
        run: |
          set -euo pipefail
          test -n "$SUMS" || { echo "::error::Prebuilt mode requires gated_sha256sums."; exit 1; }
          names=($(awk '{for (i = 2; i <= NF; i += 2) print "-p", $i}' <<< "$SUMS"))
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist "${names[@]}"
          uv run --no-project --python 3.12 python release-tools/checks/release_assets.py --dist dist --version "$VERSION" --linux "$LINUX"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # The candidate: this part's files on the tag's GitHub prerelease, for the gate. Never PyPI. The first part
  # (with x86_64) creates it; a later part adds files it lacks and extends SHA256SUMS. A file never changes.
  candidate:
    needs: [build, build-aarch64]
    if: ${{ !cancelled() && !inputs.rehearsal && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
      ADDING: ${{ !contains(fromJSON(inputs.linux), 'x86_64') }}
      LINUX: ${{ inputs.linux }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-dist*
          merge-multiple: true
          path: dist
      - working-directory: dist
        run: |
          set -euo pipefail
          files=(cozy_runtime-*)
          sha256sum -- "${files[@]}" > part.sums && cat part.sums
          held=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null) || held=none
          if [ "$ADDING" = true ]; then
            [ "$held" != none ] && grep -qx SHA256SUMS <<< "$held" \
              || { echo "::error::$TAG has no first part: the part with x86_64 creates the release"; exit 1; }
            for f in "${files[@]}"; do
              ! grep -qxF "$f" <<< "$held" || { echo "::error::$TAG already holds $f: a candidate's files never change"; exit 1; }
            done
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS
            sort -k2 -o SHA256SUMS SHA256SUMS part.sums
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" -- "${files[@]}"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS
          elif [ "$held" != none ]; then
            [ -z "$held" ] || { echo "::error::$TAG already holds files: a candidate's files never change"; exit 1; }
            cp part.sums SHA256SUMS
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" -- "${files[@]}" SHA256SUMS
          else
            cp part.sums SHA256SUMS
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "cozy-runtime ${TAG#v} (candidate)" \
              --notes "Gate, then publish: .github/workflows/runtime-publish.yaml" -- "${files[@]}" SHA256SUMS
          fi
          w=$(grep -E 'manylinux_2_28_x86_64\.whl$' SHA256SUMS || true)
          { [ -z "$w" ] || echo "gate with: runtime_wheel=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${w##* }#sha256=${w%% *}"
            echo "publish with: -f linux='$LINUX' -f gated_sha256sums='$(tr '\n' ' ' < part.sums)'"; } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [gated]
    if: ${{ !cancelled() && !inputs.rehearsal && needs.gated.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 20
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - id: sums
        env:
          SUMS: ${{ needs.gated.outputs.sha256sums }}
        run: |
          { echo 'all<<SUMS'; printf '%s\n' "$SUMS"; echo SUMS; } >> "$GITHUB_OUTPUT"
      - name: Upload set is exactly what build hashed
        env:
          SUMS: ${{ steps.sums.outputs.all }}
        working-directory: dist
        run: |
          printf '%s\n' "$SUMS" | sha256sum --check --strict
          [ "$(ls | sort)" = "$(printf '%s\n' "$SUMS" | awk '{print $2}' | sort)" ]
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      # Uploads land one file at a time; a lock taken mid-upload silently misses platform
      # files. Wait while files are absent, refuse at once on any file this run did not build.
      - name: PyPI serves exactly the built files
        env:
          VERSION: ${{ needs.gated.outputs.version }}
          SUMS: ${{ steps.sums.outputs.all }}
          ADDING: ${{ !contains(fromJSON(inputs.linux), 'x86_64') }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          version = os.environ["VERSION"]
          want = {name: digest for digest, name in (line.split() for line in os.environ["SUMS"].splitlines())}
          prefixes = (f"cozy_runtime-{version}-", f"cozy_runtime-{version}.tar.gz")
          request = urllib.request.Request(
              f"https://pypi.org/pypi/cozy-runtime/{version}/json", headers={"Cache-Control": "no-cache"}
          )
          while True:
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      files = json.load(response)["urls"]
              except (OSError, urllib.error.URLError) as error:
                  print(f"PyPI JSON unavailable ({error}); retrying", flush=True)
                  time.sleep(5)
                  continue
              served = {f["filename"]: f["digests"].get("sha256") for f in files if f["filename"].startswith(prefixes)}
              # A part added to a released version leaves the earlier parts' files beside its own.
              adding = os.environ["ADDING"] == "true"
              wrong = {name: digest for name, digest in served.items() if (name in want or not adding) and want.get(name) != digest}
              if wrong:
                  sys.exit(f"PyPI serves files this run did not build: {wrong}")
              missing = sorted(set(want) - set(served))
              if not missing:
                  print("\n".join(f"{want[name]}  {name}" for name in sorted(want)))
                  break
              print(f"not yet served: {missing}", flush=True)
              time.sleep(5)
          PY

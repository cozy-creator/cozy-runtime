name: Publish to PyPI

# Publication IS the tag push (cozy-eval's pattern). No local publish —
# this workflow is the single release procedure.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished version tag to publish
        type: string
        required: true
  push:
    tags:
      - 'v*'

# Serialize retries for one release name; distinct versions can build independently.
concurrency:
  group: runtime-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The cheap refusals, ahead of the expensive build. ci.yaml owns lint + types + the
  # behaviour gate on every push; this re-runs the architecture fences against the exact
  # tagged tree rather than trusting that the tag points at a commit CI already saw.
  gate:
    outputs:
      source: ${{ steps.release.outputs.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - id: release
        name: Verify immutable unpublished release identity
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source
      - run: uv sync --locked
        working-directory: source
      - name: Fences
        run: uv run python checks/architecture.py
        working-directory: source

  # ONE package, TWO wheel files (cr-094). This is the second one: same source, same
  # version, tagged cp312-abi3 and carrying `cozy_runtime/_kernels/_C.abi3.so`, so a
  # linux/x86 install gets the fused Anima kernels by standard wheel-tag selection alone.
  # The recipe lives in the script, not here, because a developer needs to run the very
  # same build on a box with no CUDA toolkit.
  kernel-wheel:
    needs: gate
    runs-on: ubuntu-latest
    # Hang bound, not a work budget: image pull + CUDA toolkit + six-architecture compile.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Fetch the pinned public native donor
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          filename = "cozy_runtime-0.18.32-cp312-abi3-manylinux_2_28_x86_64.whl"
          expected = "60d9cf186eb677461bbd34e8731caa622ded671a3d36459d156165ae1146e0e3"
          with urllib.request.urlopen("https://pypi.org/pypi/cozy-runtime/0.18.32/json", timeout=30) as response:
              metadata = json.load(response)
          rows = [row for row in metadata["urls"] if row["filename"] == filename]
          if len(rows) != 1 or rows[0]["digests"]["sha256"] != expected:
              raise SystemExit("PyPI native donor differs from its reviewed release pin")
          url = urllib.parse.urlsplit(rows[0]["url"])
          if url.scheme != "https" or url.netloc != "files.pythonhosted.org":
              raise SystemExit("native donor URL is outside the public PyPI file origin")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / filename
          with urllib.request.urlopen(rows[0]["url"], timeout=60) as response, path.open("wb") as output:
              while chunk := response.read(1 << 20):
                  output.write(chunk)
          with path.open("rb") as source:
              if hashlib.file_digest(source, "sha256").hexdigest() != expected:
                  raise SystemExit("downloaded native donor failed its pinned SHA-256")
          PY
      - name: Reuse unchanged native inputs or build the kernels wheel
        run: |
          set +e
          uv run --script scripts/build-dev-wheel.py \
            --native-wheel "$RUNNER_TEMP/cozy_runtime-0.18.32-cp312-abi3-manylinux_2_28_x86_64.whl" \
            --native-sha256 60d9cf186eb677461bbd34e8731caa622ded671a3d36459d156165ae1146e0e3 \
            --release-commit "${{ needs.gate.outputs.source }}" --reuse-or-build --out dist
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            scripts/build-kernel-wheel.sh --out dist --commit "${{ needs.gate.outputs.source }}"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [gate, kernel-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 20
    permissions:
      contents: read   # checkout on a private/org repo
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source }}

      - uses: astral-sh/setup-uv@v7

      - run: uv python install 3.12

      - run: uv sync --locked

      # The pure wheel is first-class, not a fallback: every platform that is not
      # linux/x86 installs it, and it is the only artifact a macOS or Windows box sees.
      - name: Build (sdist + pure-py wheel)
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ needs.gate.outputs.source }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          uv build

      - uses: actions/download-artifact@v4
        with:
          name: kernel-wheel
          path: dist

      # cr-095: the release that silently carried ONE wheel is exactly the regression this
      # job exists to prevent, so the shape of `dist/` is a refusal rather than a hope.
      - name: Release carries the sdist and BOTH wheels
        run: |
          ls -l dist
          uv run python - <<'PY'
          import pathlib, sys
          v = __import__("tomllib").load(open("pyproject.toml", "rb"))["project"]["version"]
          want = {
              f"cozy_runtime-{v}.tar.gz",
              f"cozy_runtime-{v}-py3-none-any.whl",
              f"cozy_runtime-{v}-cp312-abi3-manylinux_2_28_x86_64.whl",
          }
          dist = pathlib.Path("dist")
          have = {p.name for p in [*dist.glob("*.whl"), *dist.glob("*.tar.gz")]}
          if have != want:
              sys.exit(f"dist is not the release set\n  missing: {sorted(want - have)}\n  extra:   {sorted(have - want)}")
          print("\n".join(sorted(have)))
          PY

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

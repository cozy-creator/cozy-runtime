name: Publish to PyPI

# Explicit publication only: creating a tag never starts a companion source build.
# Source build:
#   gh workflow run publish.yaml -f release_tag=vX.Y.Z -f mode=source
# Approved existing release assets:
#   gh workflow run publish.yaml -f release_tag=vX.Y.Z -f mode=prebuilt -f gated_sha256sums='<sha256> <filename> ...'
# Add -f rehearsal=true to verify a tag/files without entering the publish job.
# Build/download jobs have read-only repository access. Only publish obtains PyPI OIDC.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished version tag to publish
        type: string
        required: true
      mode:
        description: Build from the tag or use approved existing release assets
        type: choice
        required: true
        default: source
        options:
          - source
          - prebuilt
      rehearsal:
        description: Verify only; allow an existing PyPI version and never publish
        type: boolean
        default: false
      gated_sha256sums:
        description: '"<sha256> <filename>" pairs, space separated: publish exactly these release assets, no build'
        type: string
        default: ''

# Serialize retries for one release name; distinct versions can build independently.
concurrency:
  group: runtime-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.mode == 'source' }}
    outputs:
      version: ${{ steps.dist.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    runs-on: ubuntu-latest
    # Hang bound, not a work budget: a native-input change adds image pull + CUDA toolkit +
    # six-architecture compile.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
        with:
          # A tag-scoped cache is never restored by another tag.
          save-cache: false
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: uv python install 3.12
      - name: Source mode carries no prebuilt asset selection
        env:
          SUMS: ${{ inputs.gated_sha256sums }}
        run: |
          if [ -n "$SUMS" ]; then
            echo "::error::Use mode=prebuilt when supplying gated_sha256sums."
            exit 1
          fi
      - id: release
        name: Verify immutable release identity
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source ${{ inputs.rehearsal && '--rehearsal' || '' }}
      - name: Verify source dependency access before building
        env:
          TENSORFS_KEY: ${{ secrets.TENSORFS_READ_KEY }}
        run: bash release-tools/scripts/prepare-release-source-access.sh
      - run: uv sync --locked
        working-directory: source
      # One Python source build plus the kernel wheel (cr-094): the latter is tagged
      # cp312-abi3 and carrying `cozy_runtime/_kernels/_C.abi3.so`. The recipe lives in the
      # scripts so a developer can run the very same build on a box with no CUDA toolkit.
      - name: Fetch the pinned public native donor
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          filename = "cozy_runtime-0.18.86-cp312-abi3-manylinux_2_28_x86_64.whl"
          expected = "d47d42187e8121a832fe69a8fa3faa676bd462d44f8c6c103685cfdb336ab7db"
          with urllib.request.urlopen("https://pypi.org/pypi/cozy-runtime/0.18.86/json", timeout=30) as response:
              metadata = json.load(response)
          rows = [row for row in metadata["urls"] if row["filename"] == filename]
          if len(rows) != 1 or rows[0]["digests"]["sha256"] != expected:
              raise SystemExit("PyPI native donor differs from its reviewed release pin")
          url = urllib.parse.urlsplit(rows[0]["url"])
          if url.scheme != "https" or url.netloc != "files.pythonhosted.org":
              raise SystemExit("native donor URL is outside the public PyPI file origin")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / filename
          with urllib.request.urlopen(rows[0]["url"], timeout=60) as response, path.open("wb") as output:
              while chunk := response.read(1 << 20):
                  output.write(chunk)
          with path.open("rb") as source:
              if hashlib.file_digest(source, "sha256").hexdigest() != expected:
                  raise SystemExit("downloaded native donor failed its pinned SHA-256")
          PY
      # Runs on the still-clean checkout: reuse refuses a dirty tree, and stamping dirties it.
      - name: Reuse unchanged native inputs or build the kernels wheel
        working-directory: source
        run: |
          set +e
          uv run --script scripts/build-dev-wheel.py \
            --native-wheel "$RUNNER_TEMP/cozy_runtime-0.18.86-cp312-abi3-manylinux_2_28_x86_64.whl" \
            --native-sha256 d47d42187e8121a832fe69a8fa3faa676bd462d44f8c6c103685cfdb336ab7db \
            --release-commit "${{ steps.release.outputs.source }}" --reuse-or-build --out dist
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            scripts/build-kernel-wheel.sh --out dist --commit "${{ steps.release.outputs.source }}"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      # The pure wheel remains the portable macOS/Windows/source-build artifact.
      - name: Build (sdist + pure-py wheel)
        working-directory: source
        env:
          COZY_RUNTIME_BUILD_COMMIT: ${{ steps.release.outputs.source }}
        run: |
          uv run python scripts/stamp-build-provenance.py "$COZY_RUNTIME_BUILD_COMMIT"
          uv build --out-dir dist
      # TensorD itself is public; only private TensorFS source needs additional read access.
      - name: Bundle the pinned cozy-machine into the Linux wheel
        working-directory: source
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: task machine
      - name: Verify wheel selection and the installed machine command
        working-directory: source
        run: uv run --script scripts/verify-machine-wheels.py --dist dist
      # cr-095: a release silently missing a platform file is refused.
      # Everything visible in dist/ is uploaded, so the set is exact; the digests travel to
      # `publish` outside the artifact.
      - id: dist
        name: Release carries the sdist, portable wheel and the Linux wheel
        working-directory: source
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, os, pathlib, sys, tomllib
          v = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          want = {
              f"cozy_runtime-{v}.tar.gz",
              f"cozy_runtime-{v}-py3-none-any.whl",
              f"cozy_runtime-{v}-cp312-abi3-manylinux_2_28_x86_64.whl",
          }
          dist = pathlib.Path("dist")
          # uv writes dist/.gitignore; hidden files are neither uploaded nor published.
          have = {p.name for p in dist.iterdir() if not p.name.startswith(".")}
          if have != want:
              sys.exit(f"dist is not the release set\n  missing: {sorted(want - have)}\n  extra:   {sorted(have - want)}")
          sums = "\n".join(
              f"{hashlib.sha256((dist / name).read_bytes()).hexdigest()}  {name}" for name in sorted(want)
          )
          print(sums)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\nsha256sums<<SUMS\n{sums}\nSUMS\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: source/dist/
          if-no-files-found: error

  # The gated files a release candidate was proven with, byte for byte: the release's assets,
  # refused unless they are exactly the sums the release owner recorded. No artifact code runs.
  gated:
    if: ${{ inputs.mode == 'prebuilt' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: release
        name: Verify immutable release identity without executing artifact code
        run: uv run --no-project --python 3.12 python release-tools/checks/release.py --source source ${{ inputs.rehearsal && '--rehearsal' || '' }}
      - id: dist
        name: The release holds exactly the approved files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          SUMS: ${{ inputs.gated_sha256sums }}
        run: |
          set -eu
          test -n "$SUMS" || { echo "::error::Prebuilt mode requires gated_sha256sums."; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          uv run --no-project --python 3.12 python release-tools/checks/release_assets.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, gated]
    if: ${{ !cancelled() && !inputs.rehearsal && (needs.build.result == 'success' || needs.gated.result == 'success') }}
    runs-on: ubuntu-latest
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 20
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Upload set is exactly what build hashed
        env:
          SUMS: ${{ needs.build.outputs.sha256sums || needs.gated.outputs.sha256sums }}
        working-directory: dist
        run: |
          printf '%s\n' "$SUMS" | sha256sum --check --strict
          [ "$(ls | sort)" = "$(printf '%s\n' "$SUMS" | awk '{print $2}' | sort)" ]
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      # Uploads land one file at a time; a lock taken mid-upload silently misses platform
      # files. Wait while files are absent, refuse at once on any file this run did not build.
      - name: PyPI serves exactly the built files
        env:
          VERSION: ${{ needs.build.outputs.version || needs.gated.outputs.version }}
          SUMS: ${{ needs.build.outputs.sha256sums || needs.gated.outputs.sha256sums }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          version = os.environ["VERSION"]
          want = {name: digest for digest, name in (line.split() for line in os.environ["SUMS"].splitlines())}
          prefixes = (f"cozy_runtime-{version}-", f"cozy_runtime-{version}.tar.gz")
          request = urllib.request.Request(
              f"https://pypi.org/pypi/cozy-runtime/{version}/json", headers={"Cache-Control": "no-cache"}
          )
          while True:
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      files = json.load(response)["urls"]
              except (OSError, urllib.error.URLError) as error:
                  print(f"PyPI JSON unavailable ({error}); retrying", flush=True)
                  time.sleep(5)
                  continue
              served = {f["filename"]: f["digests"].get("sha256") for f in files if f["filename"].startswith(prefixes)}
              wrong = {name: digest for name, digest in served.items() if want.get(name) != digest}
              if wrong:
                  sys.exit(f"PyPI serves files this run did not build: {wrong}")
              missing = sorted(set(want) - set(served))
              if not missing:
                  print("\n".join(f"{want[name]}  {name}" for name in sorted(want)))
                  break
              print(f"not yet served: {missing}", flush=True)
              time.sleep(5)
          PY

name: platforms
# A published Runtime on every desktop platform, Linux x86_64 as the control: does it install
# (TensorFS has only a linux-x86_64 wheel, so elsewhere it builds from the sdist), which modules
# import, do the CLI verbs run, and on macOS what MPS serves (SDXL-width UNet, VAE, attention vs
# CPU fp32). `mps` runs this ref's Apple-GPU tests on macos-15 (`sdxl`: the SDXL spike too);
# `windows` its executor-path tests on windows-2025.
# Manual only: macOS bills 10x and Windows 2x.
#   gh workflow run platforms.yaml -R cozy-creator/cozy-runtime --ref <branch> [-f os='["macos-15"]'] [-f runtime=<version>]
#   gh workflow run platforms.yaml -R cozy-creator/cozy-runtime --ref <branch> -f os='[]' -f mps=true [-f sdxl=true]
#   gh workflow run platforms.yaml -R cozy-creator/cozy-runtime --ref <branch> -f os='[]' -f windows=true
on:
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]'
      runtime:
        description: Published cozy-runtime version; empty takes the newest
        type: string
        default: ''
      tensorfs_ref:
        description: TensorFS branch, tag or SHA built from source and installed first; empty takes PyPI's (mps builds cross-platform-probe)
        type: string
        default: ''
      mps:
        description: This ref's Apple-GPU tests on macos-15
        type: boolean
        default: false
      sdxl:
        description: With mps, the SDXL spike (fidika/sdxl from tensorhub.com, ~7 GB)
        type: boolean
        default: false
      windows:
        description: This ref's executor-path tests on windows-2025
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    if: inputs.os != '[]'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/platforms

      - uses: astral-sh/setup-uv@v7

      # TensorFS builds from its sdist off linux-x86_64.
      - uses: dtolnay/rust-toolchain@1.91.1

      - name: Venv
        run: |
          uv venv --python 3.12 .venv
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          echo "PY=$PWD/$py" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in macOS) echo "TORCH_BACKEND=" ;; *) echo "TORCH_BACKEND=--torch-backend=cpu" ;; esac >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: inputs.tensorfs_ref != ''
        with:
          repository: cozy-creator/tensorfs
          ref: ${{ inputs.tensorfs_ref }}
          ssh-key: ${{ secrets.TENSORFS_READ_KEY }}
          path: .tensorfs

      - name: TensorFS ${{ inputs.tensorfs_ref }} from source
        if: inputs.tensorfs_ref != ''
        continue-on-error: true
        run: uv pip install --python "$PY" ./.tensorfs 2>&1 | tee tensorfs.txt; exit "${PIPESTATUS[0]}"

      - name: Install cozy-runtime ${{ inputs.runtime || '(newest)' }}
        id: install
        continue-on-error: true
        run: uv pip install --python "$PY" "cozy-runtime${{ inputs.runtime && format('=={0}', inputs.runtime) || '' }}" 2>&1 | tee install.txt; exit "${PIPESTATUS[0]}"

      # Without TensorFS the rest of the probe still says what imports.
      - name: Install without TensorFS
        if: steps.install.outcome != 'success'
        run: uv pip install --python "$PY" --no-deps "cozy-runtime${{ inputs.runtime && format('=={0}', inputs.runtime) || '' }}" && uv pip install --python "$PY" cryptography msgspec numpy packaging pillow

      - name: Torch and the Diffusers group
        run: |
          uv pip install --python "$PY" $TORCH_BACKEND 'torch>=2.13' torchvision \
            'diffusers>=0.40.0' 'transformers>=5.16.1' 'peft>=0.20,<0.21' safetensors tokenizers av 2>&1 | tail -20

      - name: Probe
        id: probe
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          "$PY" -u "$GITHUB_WORKSPACE/.github/platforms/probe.py" 2>&1 | tee "$GITHUB_WORKSPACE/probe.txt"; exit "${PIPESTATUS[0]}"

      - name: Accelerator wheels
        run: |
          set +e +o pipefail
          {
            for idx in cu130 cu128; do
              echo "== torch from $idx"
              echo 'torch>=2.13' | uv pip compile - --python-version 3.12 --index-url "https://download.pytorch.org/whl/$idx" --no-header 2>&1 | grep -iE '^torch|error|no solution|not available|hint' | head -5
            done
            echo "== triton (PyPI)"
            echo 'triton' | uv pip compile - --python-version 3.12 --no-header 2>&1 | grep -iE '^triton|error|no solution|hint' | head -5
            if [ "$RUNNER_OS" = Windows ]; then
              echo "== triton-windows"
              uv pip install --python "$PY" triton-windows 2>&1 | tail -3
              "$PY" -c 'import triton; print("triton-windows imports", triton.__version__)' 2>&1 | tail -3
            fi
          } 2>&1 | tee wheels.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo "install=${{ steps.install.outcome }} probe=${{ steps.probe.outcome }}"
            echo '```'
            grep -iE 'error|failed|could not' install.txt | head -20 || true
            cat probe.txt wheels.txt 2>/dev/null | head -250 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: |
            install.txt
            tensorfs.txt
            probe.txt
            wheels.txt
          if-no-files-found: ignore
          retention-days: 30

  mps:
    if: inputs.mps
    name: mps (macos-15)
    runs-on: macos-15
    # Hang bound, not a work budget: a cold TensorFS build and the SDXL download fit well inside.
    timeout-minutes: ${{ inputs.sdxl && 75 || 30 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          sw_vers
          df -h .

      - uses: actions/checkout@v4
        with:
          repository: cozy-creator/tensorfs
          ref: ${{ inputs.tensorfs_ref || 'cross-platform-probe' }}
          ssh-key: ${{ secrets.TENSORFS_READ_KEY }}
          path: .tensorfs

      - id: tensorfs
        run: echo "sha=$(git -C .tensorfs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: wheel
        with:
          path: .tensorfs-wheel
          key: tensorfs-macos-arm64-${{ steps.tensorfs.outputs.sha }}

      - if: steps.wheel.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.91.1

      - name: TensorFS wheel
        if: steps.wheel.outputs.cache-hit != 'true'
        run: uv build --wheel --out-dir .tensorfs-wheel .tensorfs

      - name: Venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python .tensorfs-wheel/*.whl
          uv pip install --python .venv/bin/python -e '.[adapters,media]' 'torch>=2.14' torchvision \
            'diffusers>=0.40.0' 'transformers>=5.16.1' 'peft>=0.20,<0.21' safetensors tokenizers pytest

      # Its shipped lock is linux-x86_64 only: its versions pin this install (but this ref's
      # Runtime and the TensorFS built above).
      - name: The published SDXL package
        if: inputs.sdxl
        run: |
          curl -fsS -X POST https://tensorhub.com/v1/packages/fidika/sdxl/download -d '{}' > plan.json
          .venv/bin/python - <<'PY'
          import base64, json, tomllib, urllib.request
          plan = json.load(open("plan.json"))
          wheel = next(d for d in plan["downloads"] if d["kind"] == "project_wheel")
          urllib.request.urlretrieve(wheel["url"], wheel["path"])
          lock = tomllib.loads(base64.b64decode(plan["uv_lock"]["canonical_bytes"]).decode())
          pins = [f"{p['name']}=={p['version']}" for p in lock["package"]
                  if p["name"] not in ("sdxl", "cozy-runtime", "tensorfs")]
          open("pins.txt", "w").write("\n".join(pins) + "\n")
          open("wheel.txt", "w").write(wheel["path"])
          PY
          uv pip install --python .venv/bin/python -c pins.txt "./$(cat wheel.txt)"

      - name: Tests
        run: |
          .venv/bin/python -m pytest -q -rs -s --real-gpu tests/test_mps.py tests/test_parent_watch.py \
            ${{ !inputs.sdxl && '-k "not sdxl"' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mps-results
          path: ${{ runner.temp }}/mps-results
          if-no-files-found: ignore
          retention-days: 30

  windows:
    if: inputs.windows
    name: windows (windows-2025)
    runs-on: windows-2025
    # Hang bound, not a work budget.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      # This ref with its dependencies (TensorFS's win_amd64 wheel), no torch: the executor imports.
      - name: Tests
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/Scripts/python.exe -e . pytest
          .venv/Scripts/python.exe -m pytest -q -rs tests/test_windows_executor_path.py

name: build
# The PR check (tracker/design/ci-v2.md §1): errors-only lint, every source compiles, the package imports on CPU, the
# attention table's check, and the type check (scripts/typecheck.sh: mypy --strict).
# Required for merges into master and rc/*: it runs on the merge queue's group (merge_group), on the final
# PR + branch state; on a pull request it is skipped, which lets the PR be queued. A docs-only group passes
# without building.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.merge_group.head_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Hang bound, not a work budget.
    timeout-minutes: 20
    steps:
      - id: scope
        name: Docs-only changes skip the build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          files=$([ -z "$BASE" ] || gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --paginate --jq '.files[].filename') || files=
          if [ -n "$files" ] && ! grep -qvE '\.(md|txt|png|jpe?g|svg)$|^docs/|^changelog\.d/|(^|/)LICENSE$' <<< "$files"; then
            echo "docs only"; echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - if: steps.scope.outputs.run == 'true'
        run: uv sync --locked
      - if: steps.scope.outputs.run == 'true'
        run: uv run --locked ruff check --select E9,F63,F7,F82 --output-format github .
      - if: steps.scope.outputs.run == 'true'
        run: uv run --locked python -m compileall -q src
      - if: steps.scope.outputs.run == 'true'
        run: uv run --locked python -c "import cozy_runtime"
      # The attention table (xs-171): it regenerates byte for byte from measurements/, every kernel it lists is the build
      # that was measured, and every kernel a class runs was measured (scripts/attention_table.py check).
      - if: steps.scope.outputs.run == 'true'
        run: uv run --locked python scripts/attention_table.py check
      # The type check (mypy --strict): new errors fail, .mypy-baseline.txt holds the known ones.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            .venv-typecheck
            .mypy_cache
          key: typecheck-${{ runner.os }}-${{ hashFiles('scripts/typecheck-requirements.txt') }}-${{ github.sha }}
          restore-keys: typecheck-${{ runner.os }}-${{ hashFiles('scripts/typecheck-requirements.txt') }}-
      - if: steps.scope.outputs.run == 'true'
        run: scripts/typecheck.sh

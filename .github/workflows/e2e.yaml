name: e2e
# CI v2 (tracker/design/ci-v2.md): cozy-creator's e2e suites, selected by what the change touches. Required for
# merges into master: it runs on the merge queue's group (merge_group), on the final PR + branch state; on a pull
# request the called workflow skips its suites, which lets the PR be queued. The required check is this job's
# `e2e / e2e`. An rc/* queue merges on `build` alone, and the RC is tested after (cozy-creator's rc-e2e.yaml reads
# this RC; Paul, 11-12), so its groups run no suites here.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      select:
        description: Test suites to run
        required: false
        type: string
        default: ''
jobs:
  e2e:
    if: github.event_name != 'merge_group' || !startsWith(github.event.merge_group.base_ref, 'refs/heads/rc/')
    uses: cozy-creator/cozy-creator/.github/workflows/e2e.yaml@f85096b9d6a97a623515526ece6940b6635b3200
    secrets:
      TENSORHUB_READ_KEY: ${{ secrets.TENSORHUB_READ_KEY }}
    with:
      repo: cozy-runtime
      ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
      base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      select: ${{ inputs.select }}
      creator_ref: f85096b9d6a97a623515526ece6940b6635b3200
      stack_ref: rc/0.25.0
      runtime_ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
      packages_ref: rc/0.25.0

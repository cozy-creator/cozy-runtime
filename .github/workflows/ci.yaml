name: ci
on: [push, pull_request]
jobs:
  # CI is BUILD + FENCE + DETERMINISM/STALENESS only (owner rule, decisions #160, tightened
  # 2026-08-24 after audit). `scripts/verify.py`, `scripts/redarm.py` and
  # `scripts/derive-corpus.py` are BUILDER-RUN scripts that drive the real system — their
  # transcripts belong in the issue's execution record, not in an automated gate. Anything
  # below either builds, scans a boundary, or refuses a stale/non-reproducing artifact.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      # The exact TensorFS wheel is committed, hash-fenced, and is the artifact Runtime ships.
      # Install that wheel here so the ordinary architecture pass checks Runtime's reviewed
      # encoding specs against the actual bundled registry without a private source checkout.
      - run: uv sync --extra model-execution
      - run: >-
          uv run python -c "import sys, sysconfig;
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          and sysconfig.get_config_var('Py_GIL_DISABLED') != 1"
      - run: uv run ruff check .
      # Formatting is a DETERMINISM check like the others here: one canonical rendering of
      # the tree, so a diff is only ever a change of meaning. The generated `worker_pb2*`
      # bindings are excluded in pyproject's `extend-exclude`, which covers format and check
      # alike — protoc's output is a copied artifact and reformatting it would break the copy.
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Reproduce the CPython 3.12 Runtime wheel
        run: |
          set -euo pipefail
          a=$(mktemp -d)
          b=$(mktemp -d)
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$a"
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$b"
          cmp "$a"/*.whl "$b"/*.whl
      # Self-contained architecture fences + frozen ES6 vectors + torch-free import.
      - run: uv run python checks/architecture.py
      - run: uv run python checks/anima_cuda_capability.py
      - run: uv run python checks/env_seal.py
      # The descriptor is a read-only publication output, never a committed repository file.
      # The architecture fence validates the closed grammar; these exact replays prove the two
      # source fixtures derive byte-identically without dirtying either repository.
      - run: |
          set -euo pipefail
          tiny_a=$(uv run cozy-runtime --json --dir proofs/fixtures/tiny-models describe)
          tiny_b=$(uv run cozy-runtime --json --dir proofs/fixtures/tiny-models describe)
          test "$tiny_a" = "$tiny_b"
          modeled=proofs/fixtures/modeled-development-package
          modeled_descriptor=$(uv run cozy-runtime --json --dir "$modeled" describe)
          frozen=$(mktemp -d)
          printf '%s' "$modeled_descriptor" > "$frozen/descriptor.json"
          cp "$modeled/package.toml" "$frozen/package.toml"
          imported=$(uv run cozy-runtime --json --dir "$modeled" bindings)
          descriptor_only=$(uv run cozy-runtime --json --dir "$frozen" \
            --descriptor "$frozen/descriptor.json" bindings)
          test "$imported" = "$descriptor_only"
          marco_a=$(uv run --locked --project examples/marco-polo \
            cozy-runtime --json --dir examples/marco-polo describe)
          marco_b=$(uv run --locked --project examples/marco-polo \
            cozy-runtime --json --dir examples/marco-polo describe)
          test "$marco_a" = "$marco_b"
      - run: |
          set -euo pipefail
          shopt -s nullglob
          a=$(mktemp -d)
          b=$(mktemp -d)
          uv build --wheel --out-dir "$a" examples/marco-polo
          uv build --wheel --out-dir "$b" examples/marco-polo
          wheel_a=("$a"/*.whl)
          wheel_b=("$b"/*.whl)
          test "${#wheel_a[@]}" -eq 1
          test "${#wheel_b[@]}" -eq 1
          cmp "${wheel_a[0]}" "${wheel_b[0]}"
          unzip -l "${wheel_a[0]}" | grep -F 'marco_polo_package/__init__.py'
      # Every descriptor-declared fact must have a live writer — a coverage refusal over
      # the descriptor, kept because it is a fence and not a behavior test (pgw#1584).
      - run: uv run python checks/declared_facts.py
      # Runtime owns PackageDescriptor semver. This matrix is a deterministic contract fence:
      # the only minor changes are new callables and optional/omissible request fields.
      - run: uv run python checks/descriptor_compatibility.py
      - run: uv run python checks/base_observation.py
      - run: uv run python checks/model_release_routes.py
      - run: uv run python checks/multi_model_binding.py
      - run: uv run cozy-runtime version

  # THE VENDORED-DRIFT GATE (#536d). A staleness check like every other job here, and the
  # one this repo could not previously make: `src/cozy/worker/v1/` is a COPY of another
  # repo's generated output, and a copy is only a copy while somebody compares the bytes.
  #
  # The checker is worker-protocol's own `scripts/vendored-diff.sh`, invoked rather than
  # reimplemented: a drift checker with its own drifting generator would be its own
  # punchline. It regenerates from the .proto with the pinned toolchain (grpcio-tools, and
  # protoc-gen-go for the Go half) and byte-compares against what is vendored here.
  #
  # PINNED, not floating: `WORKER_PROTOCOL_SHA` is the protocol commit these bytes were
  # generated from. Bumping it and re-copying `gen/python/cozy` over `src/cozy` is one
  # change, and this job is what refuses the half of it that was forgotten.
  drift:
    runs-on: ubuntu-latest
    env:
      WORKER_PROTOCOL_SHA: ef454626f3a367e0c72b625617f63e5dbcf515db
    steps:
      - uses: actions/checkout@v4
      # SELF-ARMING, not skipped-by-default. worker-protocol-v2 is a private sibling and
      # `github.token` is scoped to THIS repository, so the byte-diff needs a read
      # credential only the owner can mint. Rather than sit red forever or hide behind a
      # hand-flipped variable, the job detects the credential and runs the moment it
      # exists — and says loudly, in the run's annotations, when it does not.
      #
      - id: credential
        run: |
          if [ -n "${{ secrets.WORKER_PROTOCOL_TOKEN }}" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=vendored-drift check not run::WORKER_PROTOCOL_TOKEN is not set, so cozy-creator/worker-protocol-v2 cannot be checked out and the byte-for-byte vendored-drift check did not run. Release validation must retain a recorded local drift check."
          fi
      - if: steps.credential.outputs.present == 'yes'
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/worker-protocol-v2
          ref: ${{ env.WORKER_PROTOCOL_SHA }}
          path: .worker-protocol
          token: ${{ secrets.WORKER_PROTOCOL_TOKEN }}
      - if: steps.credential.outputs.present == 'yes'
        uses: astral-sh/setup-uv@v7
      - if: steps.credential.outputs.present == 'yes'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: steps.credential.outputs.present == 'yes'
        run: .worker-protocol/scripts/vendored-diff.sh src

name: ci
# On demand, before a release (lint, types, fences, wheel, pytest, handoff proof):
#   gh workflow run ci.yaml -R cozy-creator/cozy-runtime --ref <branch>
# Every gate runs even when another is red; the final checks job requires all of them.
# Tests keep real process/cgroup isolation on independent runners. Automatic only for the
# model-fetch path (`model-fetch`, below); publish.yaml's build job runs the
# syntax/undefined-name lint and fences on every release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cozy_runtime/internal/worker/machine_materialization.py"
      - "src/cozy_runtime/internal/worker/machine_model_defaults.py"
      - "src/cozy_runtime/internal/worker/machine_model_resolve.py"
      - "src/cozy_runtime/internal/worker/machine_models.py"
      - "src/cozy_runtime/internal/worker/machine_serving.py"
      - "src/cozy_runtime/internal/worker/machine_release_roots.py"
      - "src/cozy_runtime/internal/worker/machine_adapter_views.py"
      - "src/cozy_runtime/internal/worker/preparations.py"
      - "src/cozy_runtime/internal/fill.py"
      - "src/cozy_runtime/internal/egress.py"
      - "src/cozy_runtime/internal/liveness.py"
      - "tests/fault_hub.py"
      - "tests/test_model_fetch_faults.py"
      - "tests/test_model_prefetch_native.py"
      - "tests/test_machine_materialization.py"
      - "tests/test_machine_model_defaults.py"
      - "tests/test_model_runtime_closure.py"
      - "tests/test_model_reader.py"
      - "tests/test_release_roots.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
  push:
    branches: [master]
    paths:
      - "src/cozy_runtime/internal/worker/machine_materialization.py"
      - "src/cozy_runtime/internal/worker/machine_model_defaults.py"
      - "src/cozy_runtime/internal/worker/machine_model_resolve.py"
      - "src/cozy_runtime/internal/worker/machine_models.py"
      - "src/cozy_runtime/internal/worker/machine_serving.py"
      - "src/cozy_runtime/internal/worker/machine_release_roots.py"
      - "src/cozy_runtime/internal/worker/machine_adapter_views.py"
      - "src/cozy_runtime/internal/worker/preparations.py"
      - "src/cozy_runtime/internal/fill.py"
      - "src/cozy_runtime/internal/egress.py"
      - "src/cozy_runtime/internal/liveness.py"
      - "tests/fault_hub.py"
      - "tests/test_model_fetch_faults.py"
      - "tests/test_model_prefetch_native.py"
      - "tests/test_machine_materialization.py"
      - "tests/test_machine_model_defaults.py"
      - "tests/test_model_runtime_closure.py"
      - "tests/test_model_reader.py"
      - "tests/test_release_roots.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Model weights must keep arriving (2026-10-01): a real loopback Hub and object store that
  # fail on purpose (resets, truncation, expired URLs, a tunnel's 404, Hub verdicts, wrong
  # bytes, a machine stop) under a real TensorFS `ensure`, plus single flight, prefetch
  # pause reasons and honest progress.
  model-fetch:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked
      # Delegated like the full suite: preparation tests start real executors in cgroups.
      - run: |
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-runtime-model-fetch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv="UV_CACHE_DIR=$UV_CACHE_DIR" \
            --setenv="UV_PYTHON_INSTALL_DIR=$(uv python dir)" \
            .venv/bin/python -m pytest -q \
            tests/test_model_fetch_faults.py tests/test_machine_materialization.py \
            tests/test_model_prefetch_native.py tests/test_machine_model_defaults.py \
            tests/test_release_roots.py
  quality:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The native release reuse proof compares against its donor's source commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv python install 3.12
      - id: sync
        run: uv sync --locked
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: >-
          uv run python -c "import sys, sysconfig;
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          and sysconfig.get_config_var('Py_GIL_DISABLED') != 1"
      # Gate on bug classes only. Formatting, line length, import order and other
      # auto-fixable style stay local (`ruff format`, `ruff check --fix`).
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --select E9,F,B --ignore F401 .
      # Fixture packages under tests/testdata are inputs to tests, not typed product code.
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: >-
          uv run mypy --follow-imports=silent
          --exclude 'src/cozy/worker/v1/worker_pb2|src/cozy_runtime/models/qwen_image21/upstream|^tests/testdata/'
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python checks/architecture.py
      - name: Reproducible wheel
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          set -euo pipefail
          a=$(mktemp -d); b=$(mktemp -d)
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$a"
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$b"
          cmp "$a"/*.whl "$b"/*.whl
  # Checked-in timings balance contiguous groups while preserving test order. Refresh with
  # `uv run pytest --store-durations --durations-path .github/test-durations.json` on a delegated host.
  # New tests are always collected; missing timings use the measured suite average.
  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' && matrix.group == 1 }}
      - run: uv python install 3.12
      - run: uv sync --locked
      # Restore before the cross-version tests, which are included in the full suite.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cozy-runtime-tests
          key: cross-version-seam-${{ hashFiles('tests/test_cross_version_seam.py') }}
      - name: Full test suite shard under delegated processes
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-runtime-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_GROUP}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv="UV_CACHE_DIR=$UV_CACHE_DIR" \
            --setenv="UV_PYTHON_INSTALL_DIR=$(uv python dir)" \
            .venv/bin/python -c 'import sys; sys.path.insert(0, "tests"); from test_end_to_end import NO_EXECUTOR; assert not NO_EXECUTOR, NO_EXECUTOR; import pytest; raise SystemExit(pytest.main(sys.argv[1:]))' \
            --splits 4 --group "$TEST_GROUP" --durations-path .github/test-durations.json \
            --store-durations --durations=20 --junitxml=pytest-results.xml
      - name: Test timing receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-timing-${{ matrix.group }}
          path: |
            pytest-results.xml
            .github/test-durations.json
          if-no-files-found: error
          include-hidden-files: true
  checks:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate and test group
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success

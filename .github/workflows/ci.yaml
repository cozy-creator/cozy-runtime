name: ci
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "changelog.d/**"]
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "changelog.d/**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: >-
          uv run python -c "import sys, sysconfig;
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          and sysconfig.get_config_var('Py_GIL_DISABLED') != 1"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: sh scripts/typecheck.sh
      - run: uv run python checks/architecture.py
      - name: Reproducible wheel
        run: |
          set -euo pipefail
          a=$(mktemp -d); b=$(mktemp -d)
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$a"
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$b"
          cmp "$a"/*.whl "$b"/*.whl
      - run: uv run --with "triton==3.8.0" python -m cozy_runtime.internal.fusion_build --check --arch 90
      - run: uv run pytest
      - name: Primary handoff under real supervised processes
        run: |
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-runtime-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            .venv/bin/python -c 'import sys; sys.path.insert(0, "tests"); from test_end_to_end import NO_EXECUTOR; assert not NO_EXECUTOR, NO_EXECUTOR; import pytest; raise SystemExit(pytest.main(["tests/test_primary_handoff.py", "-q", "-rs"]))'

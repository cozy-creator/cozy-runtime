name: ci
# On demand, before a release (lint, types, fences, wheel, pytest, handoff proof):
#   gh workflow run ci.yaml -R cozy-creator/cozy-runtime --ref <branch>
# Every gate after the sync runs even when an earlier one is red, so one dispatch reports all
# of them; the job still fails on any red gate. Nothing runs on push: publish.yaml's build job
# runs the whole-tree syntax/undefined-name lint and the fences on every release.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The native release reuse proof compares against its donor's source commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv python install 3.12
      - id: sync
        run: uv sync --locked
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: >-
          uv run python -c "import sys, sysconfig;
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          and sysconfig.get_config_var('Py_GIL_DISABLED') != 1"
      # Gate on bug classes only. Formatting, line length, import order and other
      # auto-fixable style stay local (`ruff format`, `ruff check --fix`).
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --select E9,F,B --ignore F401 .
      # Fixture packages under tests/testdata are inputs to tests, not typed product code.
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: >-
          uv run mypy --follow-imports=silent
          --exclude 'src/cozy/worker/v1/worker_pb2|src/cozy_runtime/models/qwen_image21/upstream|^tests/testdata/'
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python checks/architecture.py
      - name: Reproducible wheel
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          set -euo pipefail
          a=$(mktemp -d); b=$(mktemp -d)
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$a"
          SOURCE_DATE_EPOCH=946684800 uv build --wheel --out-dir "$b"
          cmp "$a"/*.whl "$b"/*.whl
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest
      # Older Runtimes' executors against this worker; their locked environments are cached.
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/cozy-runtime-tests
          key: cross-version-seam-${{ hashFiles('tests/test_cross_version_seam.py') }}
      - name: Cross-version seam under real supervised processes
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-runtime-seam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            .venv/bin/python -c 'import sys; sys.path.insert(0, "tests"); from test_end_to_end import NO_EXECUTOR; assert not NO_EXECUTOR, NO_EXECUTOR; import pytest; raise SystemExit(pytest.main(["tests/test_cross_version_seam.py", "-q", "-rs"]))'

name: rc-dev
# The open RC's Runtime for dev homes (cl-922): each push to rc/<x.y.z> builds dev-build.yaml's wheels, with their
# kernels, as the next minor's dev release (cl-952): pyproject 0.45.1 builds 0.46.0.dev<n>+g<sha8>, n the RC branch's
# first-parent commit count, so a package's floor can name it (`cozy-runtime>=0.46.0.dev312`). They go on the rolling
# GitHub prerelease `rc-<x.y.z>`, never latest, in place of the last push's native ones; each push's pure wheel stays
# there, for the locks that take it by URL. Its SHA256SUMS names this push's; a dev home's Calcifer reads it and brings
# its rentals to it. By hand: gh workflow run rc-dev.yaml -R cozy-creator/cozy-runtime --ref rc/<x.y.z>
on:
  push:
    branches: ['rc/*']
  workflow_dispatch:

# One build per RC at a time: a push while one runs waits, and only the newest waiting one runs.
concurrency:
  group: rc-dev-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: version
        run: |
          set -euo pipefail
          # The minor after the newer of this branch's version and PyPI's newest release: a release published before the
          # RC takes it in (0.46.0 while the branch says 0.45.1) leaves the RC newer than it, 0.47.0.dev<n>.
          read -r major minor <<< "$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"$/\1 \2/p' pyproject.toml | head -1)"
          read -r pmajor pminor <<< "$(curl -fsSL https://pypi.org/pypi/cozy-runtime/json | jq -r '.info.version' | awk -F. '{print $1, $2}')"
          if [ "$pmajor" -gt "$major" ] || { [ "$pmajor" = "$major" ] && [ "$pminor" -gt "$minor" ]; }; then major=$pmajor minor=$pminor; fi
          version="$major.$((minor + 1)).0.dev$(git rev-list --count --first-parent HEAD)+g${GITHUB_SHA:0:8}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the open RC's Runtime: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    uses: ./.github/workflows/dev-build.yaml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cozy-runtime-${{ github.sha }}
          path: dist
      # New files first, SHA256SUMS next (a reader sees the old build or this one, whole), stale native files last.
      - name: The RC's prerelease holds this build
        working-directory: dist
        run: |
          set -euo pipefail
          case $BRANCH in rc/*) ;; *) echo "::error::$BRANCH is no RC branch"; exit 1 ;; esac
          tag="rc-${BRANCH#rc/}"
          shopt -s nullglob
          wheels=(*-manylinux_*.whl *-py3-none-any.whl)
          [ "${#wheels[@]}" -gt 1 ] || { echo "::error::the build made no native and pure wheel"; ls -la; exit 1; }
          sha256sum "${wheels[@]}" > SHA256SUMS
          cat SHA256SUMS
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$REPO" --target "$SHA" --prerelease --latest=false \
              --title "$BRANCH dev builds" --notes "The newest build of $BRANCH, for dev homes (cl-922). Replaced by each push."
          fi
          gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true >/dev/null
          stale=$(gh release view "$tag" -R "$REPO" --json assets --jq '.assets[].name')
          gh release upload "$tag" -R "$REPO" --clobber "${wheels[@]}"
          gh release upload "$tag" -R "$REPO" --clobber SHA256SUMS
          # A pure wheel stays: a lock takes it by URL (cl-952).
          for name in $stale; do
            case " ${wheels[*]} SHA256SUMS " in *" $name "*) ;; *-py3-none-any.whl) ;; *) gh release delete-asset "$tag" "$name" -R "$REPO" -y ;; esac
          done
          gh release edit "$tag" -R "$REPO" --notes "$BRANCH at $SHA, for dev homes (cl-922). Replaced by each push."
          echo "$tag: $BRANCH at $SHA" >> "$GITHUB_STEP_SUMMARY"

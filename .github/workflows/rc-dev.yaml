name: rc-dev
# The open RC's Runtime for dev homes (cl-922): each push to rc/<x.y.z> builds dev-build.yaml's wheels, with their
# kernels, as the minor it makes, a dev release (cl-952): pyproject 0.47.0.dev0 (set when 0.46.0 froze) builds
# 0.47.0.dev<n>+g<sha8>, n the RC branch's first-parent commit count, and a release version (0.45.2) the next minor's; so a
# package's floor can name its minor (`cozy-runtime>=0.47.0.dev0`), never a build. They go on the rolling
# GitHub prerelease `rc-<x.y.z>`, never latest, beside the newest earlier pushes' (KEEP builds in all), so a lock made
# minutes before a merge still resolves. Its SHA256SUMS names every wheel there, the newest version first: each reader
# (Calcifer, packages' scripts/rc-runtime.sh, cozy-creator's e2e) takes the first line that fits, the newest build. By hand: gh workflow run rc-dev.yaml -R cozy-creator/cozy-runtime --ref rc/<x.y.z>
on:
  push:
    branches: ['rc/*']
  workflow_dispatch:

# One build per RC at a time: a push while one runs waits, and only the newest waiting one runs.
concurrency:
  group: rc-dev-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: version
        run: |
          set -euo pipefail
          # The branch's own version says which minor it makes: a dev release (0.47.0.dev0, set at the last release's freeze)
          # names it; a release (0.45.2) means the next. PyPI's newest release, when newer, moves it on too.
          own=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          read -r major minor <<< "$(awk -F. '{print $1, $2}' <<< "$own")"
          case $own in *.dev*) ;; *) minor=$((minor + 1)) ;; esac
          read -r pmajor pminor <<< "$(curl -fsSL https://pypi.org/pypi/cozy-runtime/json | jq -r '.info.version' | awk -F. '{print $1, $2}')"
          if [ "$pmajor" -gt "$major" ] || { [ "$pmajor" = "$major" ] && [ "$pminor" -ge "$minor" ]; }; then major=$pmajor minor=$((pminor + 1)); fi
          version="$major.$minor.0.dev$(git rev-list --count --first-parent HEAD)+g${GITHUB_SHA:0:8}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the open RC's Runtime: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    uses: ./.github/workflows/dev-build.yaml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cozy-runtime-${{ github.sha }}
          path: dist
      # New files first, SHA256SUMS next (a reader sees the last builds or these, whole), builds past the newest KEEP last.
      - name: The RC's prerelease holds this build and the newest earlier ones
        working-directory: dist
        env:
          KEEP: 20
        run: |
          set -euo pipefail
          case $BRANCH in rc/*) ;; *) echo "::error::$BRANCH is no RC branch"; exit 1 ;; esac
          tag="rc-${BRANCH#rc/}"
          shopt -s nullglob
          wheels=(*-manylinux_*.whl *-py3-none-any.whl)
          [ "${#wheels[@]}" -gt 1 ] || { echo "::error::the build made no native and pure wheel"; ls -la; exit 1; }
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$REPO" --target "$SHA" --prerelease --latest=false \
              --title "$BRANCH dev builds" --notes "The newest builds of $BRANCH, for dev homes (cl-922)."
          fi
          gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true >/dev/null
          held=$(gh release view "$tag" -R "$REPO" --json assets --jq '.assets[].name')
          old=$(gh release download "$tag" -R "$REPO" -p SHA256SUMS -O - 2>/dev/null || true)
          # This build's wheels and each earlier one the last SHA256SUMS names and the release holds, newest version first
          # (by dev number, whatever order they were pushed in), of the newest KEEP builds. A wheel no SHA256SUMS named goes:
          # every kept one has its sum.
          {
            for wheel in "${wheels[@]}"; do
              echo "$(cut -d- -f2 <<< "$wheel") $(sha256sum "$wheel" | cut -d' ' -f1) $wheel"
            done
            while read -r sum file; do
              file=${file#\*}
              if [ -n "$file" ] && grep -qxF "$file" <<< "$held" && ! printf '%s\n' "${wheels[@]}" | grep -qxF "$file"; then
                echo "$(cut -d- -f2 <<< "$file") $sum $file"
              fi
            done <<< "$old"
          } | sort -s -k1,1 -V -r | awk -v keep="$KEEP" '$1 != last { n++; last = $1 } n <= keep { print $2 "  " $3 }' > SHA256SUMS
          cat SHA256SUMS
          grep -qF "  ${wheels[0]}" SHA256SUMS || { echo "::error::$tag holds $KEEP newer builds than this one"; exit 1; }
          gh release upload "$tag" -R "$REPO" --clobber "${wheels[@]}"
          gh release upload "$tag" -R "$REPO" --clobber SHA256SUMS
          listed=" $(awk '{print $2}' SHA256SUMS | tr '\n' ' ') SHA256SUMS "
          for name in $held; do
            case $listed in *" $name "*) ;; *) gh release delete-asset "$tag" "$name" -R "$REPO" -y ;; esac
          done
          gh release edit "$tag" -R "$REPO" --notes "$BRANCH at $SHA and its newest earlier builds (up to $KEEP), for dev homes (cl-922)."
          echo "$tag: $BRANCH at $SHA, $(awk '{print $2}' SHA256SUMS | cut -d- -f2 | sort -u | wc -l) builds kept" >> "$GITHUB_STEP_SUMMARY"

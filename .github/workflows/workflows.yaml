name: workflows
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/actionlint.yaml']
  push:
    branches: [master]
    paths: ['.github/workflows/**', '.github/actionlint.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

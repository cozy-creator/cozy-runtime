[package]
name = "cozy-execution"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_execution"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

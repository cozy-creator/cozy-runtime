[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[project]
name = "marco-polo-package"
version = "1.0.0"
description = "Weightless Marco/Polo example for Tensorhub publication and worker placement"
requires-python = ">=3.11"
dependencies = ["cozy-runtime==0.0.3"]

[tool.cozy]
organization = "paul"

[tool.uv.sources]
cozy-runtime = { path = "../..", editable = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "marco-polo-package"
version = "1.0.1"
description = "Weightless Marco/Polo example for Tensorhub publication and worker placement"
requires-python = ">=3.11"
dependencies = [
    "cozy-runtime>=0.0.3",
    "msgspec>=0.19",
]

[tool.cozy]
organization = "paul"

[tool.uv.sources]
cozy-runtime = { path = "../..", editable = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "marco-polo"
version = "1.0.4"
description = "Weightless Marco/Polo example for Tensorhub publication and worker placement"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.1,<1",
    "msgspec>=0.19",
]

[project.entry-points."cozy.application"]
default = "marco_polo_package:app"

[tool.uv.build-backend]
module-name = "marco_polo_package"
module-root = ""

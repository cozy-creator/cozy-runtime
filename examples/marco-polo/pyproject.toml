[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "marco-polo"
version = "1.0.4"
description = "Weightless Marco/Polo example for Tensorhub publication and worker placement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.0.19,<1.0.0",
    "msgspec>=0.19",
]

[project.entry-points."cozy.application"]
default = "marco_polo_package:app"

[tool.uv.sources]
cozy-runtime = { path = "../..", editable = true }

[tool.uv.build-backend]
module-name = "marco_polo_package"
module-root = ""

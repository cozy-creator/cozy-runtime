[project]
name = "h3-bounded-rowwise-gemm-gate"
version = "0.0.2"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19.0", "torch==2.14.0"]

[project.entry-points."cozy.application"]
default = "rowwise_gemm_gate:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rowwise_gemm_gate"]

[project]
name = "h3-hopper-dense-prefix"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime[minimax-h3]==0.23.7", "tensorfs==0.6.1", "torch==2.14.0", "triton==3.8.0"]

[project.entry-points."cozy.application"]
default = "dense_prefix:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dense_prefix"]

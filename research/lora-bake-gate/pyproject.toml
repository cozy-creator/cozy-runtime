[project]
name = "h3-lora-bake-equivalence"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19.0", "torch==2.14.0"]
[project.entry-points."cozy.application"]
default = "lora_bake_gate:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["lora_bake_gate"]

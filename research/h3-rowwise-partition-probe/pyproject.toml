[project]
name = "h3-rowwise-partition-probe"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime==0.23.2", "tensorfs==0.6.1", "torch==2.14.0"]

[project.entry-points."cozy.application"]
default = "rowwise_partition_probe:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rowwise_partition_probe"]

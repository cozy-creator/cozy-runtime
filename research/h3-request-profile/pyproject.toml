[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "h3-request-profile"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19,<0.20", "minimax-h3==1.26.2", "torch==2.14.0", "triton==3.8.0", "qwen-image-2>=0.3.0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "h3_request_profile:app"

[tool.uv.build-backend]
module-name = "h3_request_profile"
module-root = ""

[tool.uv.sources]
minimax-h3 = { index = "tensorhub" }
qwen-image-2 = { index = "tensorhub" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-refiner-ffn"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37.2", "diffusers==0.41.0", "torch==2.14.0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "ci_varena_refiner_ffn:app"

[tool.uv.build-backend]
module-name = "ci_varena_refiner_ffn"
module-root = ""

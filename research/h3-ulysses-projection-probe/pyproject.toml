[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3-ulysses-projection-probe"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime[minimax-h3]==0.23.5", "tensorfs==0.6.1", "torch==2.14.0", "triton==3.8.0", "diffusers @ git+https://github.com/huggingface/diffusers@578c9b2c6636ab2424a0e56186268b83623656b2"]

[project.entry-points."cozy.application"]
default = "projection_probe:app"

[tool.hatch.build.targets.wheel]
packages = ["projection_probe"]

[tool.hatch.metadata]
allow-direct-references = true

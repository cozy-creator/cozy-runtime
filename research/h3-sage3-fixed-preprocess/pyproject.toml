[project]
name = "h3-sage3-fixed-preprocess"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime==0.23.4", "tensorfs==0.6.1", "torch==2.14.0", "triton==3.8.0"]

[project.entry-points."cozy.application"]
default = "sage3_fixed_probe:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sage3_fixed_probe"]

[project]
name = "h3-glue-bench"
version = "0.1.0"
description = "h3a-015 yardstick: eager vs fused (AOT Triton) vs regional torch.compile, one MiniMax-H3 block at the served shape"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.4.2,<1",
    "diffusers==0.40.0",
    "msgspec>=0.19",
    "torch>=2.13,<3",
    "triton==3.8.0",
]

[project.entry-points."cozy.application"]
default = "h3_glue_bench:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["h3_glue_bench.py"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

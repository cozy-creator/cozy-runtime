[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "comfy-cpu-observer"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19", "msgspec>=0.19", "websocket-client==1.9.2"]

[project.entry-points."cozy.application"]
default = "comfy_cpu_observer:app"

[tool.uv.build-backend]
module-name = "comfy_cpu_observer"
module-root = ""

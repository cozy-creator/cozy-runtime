[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
[project]
name = "h3-fusion-capability"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.21.6,<0.22", "tensorfs>=0.6.1,<0.7", "torch==2.14.0", "triton==3.8.0", "msgspec>=0.19", "diffusers==0.41.0.dev0"]
[project.entry-points."cozy.application"]
default = "h3_fusion_capability:app"
[tool.uv.build-backend]
module-name = "h3_fusion_capability"
module-root = ""
[tool.uv.sources]
diffusers = {git="https://github.com/huggingface/diffusers", rev="578c9b2c6636ab2424a0e56186268b83623656b2"}

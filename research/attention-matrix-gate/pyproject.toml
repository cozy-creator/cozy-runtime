[project]
name = "h3-attention-matrix-gate"
version = "0.0.2"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19.0", "torch==2.14.0", "triton==3.8.0", "diffusers==0.41.0.dev0"]
[project.entry-points."cozy.application"]
default = "attention_matrix_gate:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["attention_matrix_gate"]
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
diffusers = {path = "vendor/diffusers-0.41.0.dev0-py3-none-any.whl"}

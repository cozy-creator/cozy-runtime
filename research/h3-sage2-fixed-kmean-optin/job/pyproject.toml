[project]
name="h3-sage2-fixed-registered-probe"
version="0.0.1"
requires-python=">=3.12,<3.13"
dependencies=["cozy-runtime[minimax-h3]>=0.23.8,<0.24", "tensorfs==0.6.1", "torch==2.14.0", "triton==3.8.0"]
[project.entry-points."cozy.application"]
default="registered_probe:app"
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["registered_probe"]

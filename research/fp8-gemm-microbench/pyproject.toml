[project]
name = "h3-fp8-gemm-microbench"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19.0", "torch==2.14.0", "triton==3.8.0"]

[project.entry-points."cozy.application"]
default = "fp8_gemm_microbench:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fp8_gemm_microbench"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "probe-package"
version = "0.1.0"
description = "A package that builds its surface out of an installed cozy package's declarations"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.1,<1", "rich-package"]

[project.entry-points."cozy.application"]
default = "probe_package:app"

[tool.uv.build-backend]
module-name = "probe_package"
module-root = ""

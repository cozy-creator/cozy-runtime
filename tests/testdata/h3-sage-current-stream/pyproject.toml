[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "h3-sage-current-stream"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.21.6,<0.22", "tensorfs>=0.6.1,<0.7", "torch==2.14.0", "triton==3.8.0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "h3_sage_current_stream:app"

[tool.uv.build-backend]
module-name = "h3_sage_current_stream"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "h3-sparse-admission"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.19,<0.20", "msgspec>=0.19", "torch>=2.14,<2.15", "triton>=3.8,<3.9", "diffusers==0.40.0"]

[project.entry-points."cozy.application"]
default = "h3_sparse_admission:app"

[tool.uv.build-backend]
module-name = "h3_sparse_admission"
module-root = ""

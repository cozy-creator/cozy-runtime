[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-required-package"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.0.12,<0.1", "msgspec>=0.19", "torch>=2.13,<3"]

[project.entry-points."cozy.application"]
default = "torch_required_package:app"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_required_package"]

[project]
name = "proof-environment-project"
version = "1.0.0"
description = "Repository-only project wheel for the Runtime environment proof"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof_environment_project"]

[tool.hatch.build.targets.wheel.force-include]
"package.toml" = "package.toml"
"pyproject.toml" = "pyproject.toml"
"uv.lock" = "uv.lock"

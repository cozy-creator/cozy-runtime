# The real-GPU package cr-007 serves. Bindings state SELECTION; the code names nothing.
#
# The binding below is the in-repo DEFAULT and never authority: the worker serves whatever
# its Directive's EntrypointBindingPlan resolves to, which for this verification is the
# local record under `<cozy_home>/binding-plans/`.

[application]
object = "sdxl_gpu:app"

[bindings."denoise.models.model"]
model = "cozy/sdxl-unet"
release = "cr-005"

[bindings."stubborn.models.model"]
model = "cozy/sdxl-unet"
release = "cr-005"

[bindings."pair.models.model"]
model = "cozy/sdxl-unet"
release = "cr-005"
